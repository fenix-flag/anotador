<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F12"><title>FENIX · Anotador</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F12;--surface:#16171B;--panel-2:#1C1D22;--line:#22242A;--line-2:#2E3037;--ink:#F4F2EE;--muted:#9C9AA0;--dim:#6E6C72;--accent:#F97316;--accent-ink:#FDBA74;--def:#B8B2F5;--ok:#4ADE80;--err:#F87171;--int:#60A5FA;
  --fd:'Barlow',system-ui,sans-serif;--fb:'Barlow',system-ui,sans-serif;--fm:'Barlow',system-ui,sans-serif}
body,button,select,input{font-variant-numeric:tabular-nums}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);padding:24px 16px 60px}
.wrap{max-width:1120px;margin:0 auto}
h1{font-family:var(--fd);font-weight:800;text-transform:uppercase;font-size:30px;margin:0 0 4px}
.lead{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.5;max-width:860px}
.two{display:grid;grid-template-columns:392px 1fr;gap:28px;align-items:start}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.k{font:700 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* marcador + reloj */
.top{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.sc{font:800 20px var(--fd);letter-spacing:.02em;white-space:nowrap}.sc b{font:700 20px var(--fm);margin:0 3px}.sc .f{color:var(--accent)}.sc .r{color:var(--def)}
.clk{margin-left:auto;text-align:right}.clk b{font:700 18px var(--fm)}.clk small{display:block;font:600 10px var(--fm);color:var(--muted)}
.pp{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#1A0B02;font-weight:800;cursor:pointer}
.sit{display:flex;gap:6px;align-items:center;margin:8px 0}
.side{display:flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;flex:none}
.side span{padding:7px 10px;font:800 13px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.side span.on.o{background:var(--accent);color:#1A0B02}.side span.on.d{background:var(--def);color:#15112B}
.downs{display:flex;gap:5px;align-items:center;margin:0 0 8px}.dk{font:700 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.dsel{flex:1;min-height:40px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--muted);font:700 14px var(--fm);cursor:pointer}.dsel.on{background:var(--accent);border-color:var(--accent);color:#1A0B02}
.dnext{min-height:40px;padding:0 10px;border-radius:4px;border:1px solid var(--line-2);background:none;color:var(--ink);font:800 13px var(--fd);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}.dnext:disabled{opacity:.35;cursor:default}
.clkedit{margin-top:8px;padding:10px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg)}.tbig{font:700 22px var(--fm);flex:1;text-align:center}
.mbar{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:8px;padding:9px 10px;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;color:var(--ink);cursor:pointer;font:600 14px var(--fb);text-align:left}
.mbar b{flex:1;font-weight:700}.mphd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:800 14px var(--fd);letter-spacing:.08em;text-transform:uppercase}.mid{font:600 11px var(--fm);color:var(--muted)}
.mpanel{margin:-2px 0 8px;padding:10px;border:1px solid var(--accent);border-radius:6px;background:var(--bg)}
.msel{padding:10px 12px;border:1px solid var(--line-2);border-radius:4px;font:600 14px var(--fb);display:flex;justify-content:space-between;margin-bottom:8px}
.mlist{display:flex;flex-direction:column;gap:5px}.mitem{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:600 13px var(--fb);cursor:pointer;text-align:left}
.mitem.on{border-color:var(--accent)}.mitem .ok{margin-left:auto;color:var(--ok);font:600 11px var(--fm)}.mitem .pend{margin-left:auto;color:#FACC15;font:600 11px var(--fm)}
.plist{margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
.plist .log{max-height:260px}
.la{display:flex;align-items:center;gap:6px;white-space:nowrap}
.del{min-width:28px;height:28px;border-radius:4px;border:1px solid var(--line-2);background:none;color:var(--muted);cursor:pointer;font:700 12px var(--fb)}
.del.sure{border-color:var(--err);color:var(--err);padding:0 6px}
.actions{margin-top:8px;position:sticky;bottom:0;background:var(--surface);padding:6px 0 4px;z-index:5;border-top:1px solid var(--line)}.abtns{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}.tbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}.tbar .btn{min-height:40px;padding:0 4px}.tbar .btn.fl{border-color:rgba(250,204,21,.5)}.tbar .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pmw{position:relative;display:flex}.pmw .btn{width:100%}
.pmenu{position:absolute;bottom:calc(100% + 6px);left:0;min-width:200px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.55);padding:6px;display:flex;flex-direction:column;z-index:10}
.pmenu button{min-height:44px;text-align:left;padding:0 12px;background:none;border:0;border-radius:4px;color:var(--ink);font:600 14px var(--fb);cursor:pointer}.pmenu button:hover{background:var(--line)}.pmenu button:disabled{opacity:.35;cursor:default}.pmenu .fin{color:var(--accent-ink)}
.src{color:var(--accent-ink);letter-spacing:.04em;text-transform:none;font:600 11px var(--fb);margin-left:6px}
.ydin{flex:1.4;min-width:0;min-height:44px;border-radius:4px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font:700 20px var(--fm);text-align:center}
.ydin{-moz-appearance:textfield;appearance:textfield;padding:0}.ydin::-webkit-outer-spin-button,.ydin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ydin:focus{outline:none;border-color:var(--accent)}
.psel{width:100%;min-height:46px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font:600 15px var(--fb);padding:0 12px}
.psel.on{border-color:var(--accent);background:rgba(249,115,22,.14)}.psel.d.on{border-color:var(--def);background:rgba(184,178,245,.14)}
.pbtn{width:100%;min-height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);cursor:pointer;text-align:left;font:600 15px var(--fb)}
.pbtn b{font:700 16px var(--fm);min-width:30px;padding:3px 6px;border-radius:3px;background:var(--accent);color:#1A0B02;text-align:center}.pbtn.d b{background:var(--def);color:#15112B}
.pbtn .ph{color:var(--muted)}.pbtn i{margin-left:auto;font-style:normal;color:var(--muted)}
.pbtn.on{border-color:var(--accent)}
.pbtn+.row,.plistpop+.row,.psel+.row{margin-top:10px}.pbtn.d.on{border-color:var(--def)}.pbtn.open{border-color:var(--ink)}
.plistpop{margin-top:6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);max-height:340px;overflow:auto;padding:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pit{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 8px;border:0;border-radius:4px;background:none;color:var(--ink);font:500 14px var(--fb);cursor:pointer;text-align:left}
.pit b{font:700 15px var(--fm);min-width:28px;text-align:center;color:var(--accent-ink)}.pit.d b{color:var(--def)}
.pit:hover{background:var(--line)}.pit.on{background:rgba(249,115,22,.25)}.pit.d.on{background:rgba(184,178,245,.25)}.pit em{margin-left:auto;font-style:normal;color:var(--accent-ink)}
.bsback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.bsheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(392px,100vw);z-index:41;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:14px 14px 0 0;padding:12px 12px 18px;box-shadow:0 -12px 40px rgba(0,0,0,.6)}
.bsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:800 14px var(--fd);letter-spacing:.08em;text-transform:uppercase}
.bsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bst{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);cursor:pointer}
.bst b{font:700 20px var(--fm)}.bst span{font:500 11px var(--fb);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bst.on{background:var(--accent);border-color:var(--accent);color:#1A0B02}.bst.on span{color:#1A0B02}.bst.d.on{background:var(--def);border-color:var(--def)}
.mixr .psel{flex:1;width:auto;min-width:96px;min-height:44px}
.confirm{margin-top:8px;padding:10px;border:1px solid var(--err);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}.confirm .btn{flex:none;min-height:36px;padding:0 12px}
.status{margin-top:8px;padding:9px 10px;border-radius:6px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.4);font-size:13px}
.sb-tv{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px;position:relative}
.sb-tv .tm{display:flex;flex-direction:column;align-items:center;gap:2px}
.sb-tv .lg{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 11px var(--fd);letter-spacing:.04em}
.sb-tv .f .lg{background:var(--accent);color:#1A0B02}.sb-tv .r .lg{background:var(--def);color:#15112B}
.sb-tv .nm{font:600 12px var(--fb);color:var(--muted);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-tv .tm b{font:800 34px/1 var(--fb)}.sb-tv .f b{color:var(--accent)}.sb-tv .r b{color:var(--def)}
.sb-tv .mid{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px 10px;border-radius:6px;border:1px solid var(--line-2)}
.sb-tv .per{font:800 11px var(--fd);letter-spacing:.1em;color:var(--accent-ink)}.sb-tv .mid b{font:700 24px/1.1 var(--fb);color:var(--ink)}.sb-tv .mid{color:var(--ink)}.sb-tv .clkj{font:500 10px var(--fb);color:var(--muted)}
.sb-tv .mid{gap:4px;padding:6px 14px 8px}.sb-tv .pp{width:30px;height:30px;font-size:12px}
.sb-cmp{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:700 15px var(--fb)}
.sb-cmp .t{font:800 13px var(--fd);letter-spacing:.06em;padding:3px 6px;border-radius:4px}.sb-cmp .t.f{background:var(--accent);color:#1A0B02}.sb-cmp .t.r{background:var(--def);color:#15112B}
.sb-cmp b{font:800 20px var(--fb)}.sb-cmp .dash{color:var(--muted)}.sb-cmp .sep{flex:1}
.sb-cmp .clkbox{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line-2);border-radius:6px;cursor:pointer}.sb-cmp .per{font:700 11px var(--fb);color:var(--accent-ink)}.sb-cmp .clkbox b{font-size:17px}
.sb-cmp .pp{width:32px;height:32px;font-size:12px}
.sb-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb-cards .c{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;border-top:3px solid var(--accent)}
.sb-cards .c.r{border-top-color:var(--def)}.sb-cards span{font:700 13px var(--fb);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-cards b{font:800 30px/1 var(--fb)}.sb-cards .f b{color:var(--accent)}.sb-cards .r b{color:var(--def)}
.sb-clock{display:flex;align-items:center;gap:10px;margin-top:6px;padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.sb-clock .per{font:800 12px var(--fd);letter-spacing:.08em;color:var(--accent-ink);padding:3px 7px;border:1px solid rgba(249,115,22,.5);border-radius:4px}
.sb-clock b{font:700 22px var(--fb);cursor:pointer}.sb-clock .clkj{font:500 11px var(--fb);color:var(--muted);flex:1}.sb-clock .pp{width:32px;height:32px;font-size:12px}
.tot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.tot span{color:var(--muted);font-size:12px}.tot .btn{flex:none;min-height:36px;padding:0 16px}
.drv{margin-top:10px;border-left:2px solid var(--accent);padding-left:8px}.drv.d{border-left-color:var(--def)}
.dh{font-size:12px;color:var(--muted);margin-bottom:6px}.dh b{color:var(--ink)}.dh span{color:var(--accent-ink)}
.side.full{flex:1}.side.full span{flex:1;text-align:center;padding:9px 10px}
.vbar{display:flex;gap:6px;margin:0 0 8px;align-items:flex-start}.vbar .mv{min-height:40px;margin-left:0}.vw{position:relative;flex:1}
.vbtn{width:100%;min-height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel-2);color:var(--ink);font:600 13px var(--fb);cursor:pointer;text-align:left}.vbtn i{margin-left:auto;font-style:normal;color:var(--muted)}
.vmenu{margin-top:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.55);padding:10px}
.vseg{display:flex;gap:4px;margin-top:6px}.vseg button{flex:1;min-height:38px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel-2);color:var(--muted);font:600 13px var(--fb);cursor:pointer}.vseg button.on{border-color:var(--accent);color:var(--ink);background:rgba(249,115,22,.25)}.vseg button:disabled{opacity:.35}
.mmss{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}.tf{display:flex;gap:4px;align-items:center}.tf .dsel{flex:none;width:38px}
.tin{width:64px;min-height:44px;border-radius:4px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font:700 24px var(--fb);text-align:center;-moz-appearance:textfield;appearance:textfield;padding:0}.tin::-webkit-outer-spin-button,.tin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.tin:focus{outline:none;border-color:var(--accent)}
.colon{font:700 24px var(--fb)}
.peask{display:flex;gap:6px;align-items:center;margin:-2px 0 8px;padding:8px;border:1px solid var(--accent);border-radius:6px}.peask .btn{min-height:40px}
.dpe{flex:1;text-align:center;padding:9px;border:1px solid var(--accent);border-radius:4px;color:var(--accent-ink);font:700 13px var(--fm)}
.dn{white-space:nowrap;font:700 13px var(--fm);padding:7px 9px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line-2)}
.dn.pe{border-color:var(--accent);color:var(--accent-ink)}
.mv{margin-left:auto;background:none;border:1px solid var(--line-2);color:var(--muted);border-radius:4px;padding:7px 9px;font:600 12px var(--fb);cursor:pointer}
.mv.on{border-color:var(--accent);color:var(--ink)}
/* cancha */
.fieldwrap{position:relative;background:#132a19;border-radius:6px}.fieldwrap.pan{touch-action:none;cursor:grab}.ctr{position:absolute;right:8px;bottom:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);background:rgba(14,15,18,.9);color:var(--ink);font:700 13px var(--fb);cursor:pointer}
.vista{display:flex;gap:4px;margin:0 0 6px}.vista span{flex:1;text-align:center;padding:6px 0;border:1px solid var(--line-2);border-radius:4px;font:600 12px var(--fb);color:var(--muted);cursor:pointer}.vista span.on{border-color:var(--accent);color:var(--ink)}
svg.field{display:block;border-radius:6px;touch-action:manipulation;cursor:crosshair}
.yn{font:700 10px var(--fm);fill:rgba(255,255,255,.35)}
.ask{min-height:20px;margin:0 2px 6px;font:600 13px var(--fb);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask b{color:var(--accent-ink)}
/* hoja inferior */
.sheet{margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.btn{flex:1;min-height:44px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font:800 14px var(--fd);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:0 8px}
.btn.on{border-color:var(--accent);background:rgba(249,115,22,.32);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1A0B02}
.btn.ok{border-color:rgba(74,222,128,.6)}.btn.ok.on{background:var(--ok);border-color:var(--ok);color:#0B2614}
.btn.no{border-color:rgba(248,113,113,.5)}.btn.no.on{background:var(--err);border-color:var(--err);color:#2A0B0B}
.btn.ix{border-color:rgba(96,165,250,.5)}.btn.ix.on{background:var(--int);border-color:var(--int);color:#0B1A2E}
.r3{display:grid;grid-template-columns:repeat(3,1fr)}
.btn.ghost{background:none;color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.lab{font:700 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:100%;margin:10px 0 6px}
.sheet>.lab:first-child,.pfbox .lab:first-child{margin-top:0}
.num{min-width:46px;min-height:44px;border-radius:4px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font:700 15px var(--fm);cursor:pointer}
.num.on{background:var(--accent);border-color:var(--accent);color:#1A0B02}
.num.d.on{background:var(--def);border-color:var(--def);color:#15112B}
.sum{font-size:14px;line-height:1.5}
.sum b{font-family:var(--fm)}
.steps{display:flex;gap:4px;margin:0 0 8px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line-2)}.steps span.on{background:var(--accent)}
/* lateral */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.panel h3{font:800 17px var(--fd);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{font:500 12px var(--fm);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:4px 7px;color:var(--muted)}
.kv span b{color:var(--ink);font-weight:700}
.kv span.new{border-color:rgba(249,115,22,.5)}
.log{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto}
.log>div{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px;padding:7px 9px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.log i{font:700 11px var(--fm);color:var(--muted);font-style:normal;min-width:62px}
.log .tag{font:700 11px var(--fm);padding:2px 6px;border-radius:3px}
.flow{font-size:14px;color:var(--muted);line-height:1.6}
.flow b{color:var(--ink)}
.flow ol{margin:6px 0 0;padding-left:20px}
 .empty{color:var(--dim);font-size:13px}
.editbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:8px 10px;border-radius:6px;background:rgba(249,115,22,.12);border:1px solid var(--accent);font:700 13px var(--fb)}
.log .ed{margin-left:6px}
.pfbox{border:1px solid rgba(250,204,21,.45);border-radius:6px;padding:8px;margin-bottom:8px}.fx{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:600 12px var(--fb)}
.oribar{flex-wrap:wrap;display:flex;gap:6px;align-items:center;margin:0 0 14px;font:600 14px var(--fb);color:var(--muted)}
.oribar span{padding:8px 14px;border:1px solid var(--line-2);border-radius:4px;color:var(--ink);cursor:pointer}.oribar span.on{border-color:var(--accent);background:rgba(249,115,22,.12)}
.two.land{grid-template-columns:1fr}
.phone.land{max-width:844px;position:static;border-radius:18px}
.hlay{display:grid;grid-template-columns:1fr 250px;gap:8px;align-items:start}
.hlay .sheet{margin-top:0;max-height:250px;overflow:auto}
.land .num{min-width:40px;min-height:40px}.land .btn{min-height:40px;font-size:13px}
@media(max-width:900px){.hlay{grid-template-columns:1fr}}
@media(max-width:900px){.two{grid-template-columns:1fr}.phone{position:static;max-width:392px;margin:0 auto}}

body{padding:0!important}
.phone{max-width:480px;margin:0 auto;min-height:100vh;border:0!important;border-radius:0!important;padding:10px 12px 0!important;background:var(--bg)!important}
.phone.land{max-width:900px}
@media (orientation:landscape) and (max-height:600px){.phone{max-width:960px}.lay{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;align-items:start}.lay .sheet{margin-top:0;max-height:calc(100svh - 90px);overflow:auto;position:sticky;top:6px}.lay .field.v{height:calc(100svh - 110px)!important}.lay .field.h{max-height:calc(100svh - 110px)}.actions{display:flex;gap:6px}.tbar{flex:4;margin:0}.abtns{flex:3}.actions .btn{min-height:40px}}
.pbtn .multi{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsfoot{display:flex;gap:8px;margin-top:12px}.bsfoot .btn{flex:1}
.hdr{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}.hdr img{width:30px;height:30px;object-fit:contain}
.hdr span{font:800 18px var(--fd);letter-spacing:.04em;text-transform:uppercase}.hdr b{color:var(--accent)}
.hdr>span{white-space:nowrap}.hdr .gtag{margin-left:auto;font:600 12px var(--fb);letter-spacing:0;text-transform:none;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.sb-tv .lg{position:relative;overflow:hidden;width:40px;height:40px}.sb-tv .lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg)}
.sb-tv .lg em{font-style:normal}.sb-tv .lg img+em{display:none}
.sb-tv .f .lg{background:var(--accent);color:#1A0B02}.sb-tv .r .lg{background:var(--def);color:#15112B}
select.msel{width:100%;min-height:44px;background:var(--panel-2);color:var(--ink);font:600 14px var(--fb);appearance:auto}
.tin2{flex:1;min-width:0;min-height:44px;border-radius:4px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font:600 14px var(--fb);padding:0 10px}
.status.err{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.5)}.status.wait{background:rgba(250,204,21,.06);border-color:rgba(250,204,21,.4)}
.bsheet{width:min(480px,100vw)!important}
.mitem:disabled{opacity:.45}
.empty{color:var(--dim);font-size:13px}

let tm=null;
const addAdj=o=>{UI.adj=Object.assign(UI.adj||{},o);persist();};
const rivalName=()=>UI.match?UI.match.rival:"Rival";

/* ---------------- geometría ---------------- */
function W0b(){return UI.vista==="completa"?-10:Math.max(-10,Math.min(28,G.spot-8));}
function WINf(){return UI.vista==="completa"?70:UI.vista==="zoom"?32:Math.max(32,60-W0b());}
function W0(){const b=W0b();if(!UI.pan||UI.vista==="completa")return b;return Math.max(-10,Math.min(60-WINf(),b+UI.pan));}
const canPan=()=>UI.vista!=="completa"&&WINf()<70;
function clampPan(){UI.pan=canPan()?W0()-W0b():0;}
function fieldInner(){return field()+(UI.pan?`<button class="ctr" data-a="center">⌖ Centrar</button>`:"");}
function wireField(){const fw=document.querySelector(".fieldwrap");if(!fw)return;let st=null;fw.classList.toggle("pan",canPan());
 fw.onpointerdown=e=>{if(e.target.closest("[data-a]"))return;st={x:e.clientX,y:e.clientY,p:UI.pan||0,drag:false,id:e.pointerId};};
 fw.onpointermove=e=>{if(!st||!canPan())return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.drag&&Math.hypot(dx,dy)<8)return;
  if(!st.drag){st.drag=true;try{fw.setPointerCapture(st.id);}catch(_){}}
  const r=document.getElementById("fld").getBoundingClientRect(),win=WINf();UI.pan=st.p+(UI.ori==="h"?-dx/r.width*win:dy/r.height*win);clampPan();fw.innerHTML=fieldInner();};
 fw.onpointerup=e=>{if(!st)return;const d=st.drag;st=null;if(d){draw();return;}tap(e);};
 fw.onpointercancel=()=>{st=null;};}
function P(x,yd){return UI.ori==="h"?[(yd-W0())*10,x*10]:[x*10,(W0()+WINf()-yd)*10];}
function DIM(){return UI.ori==="h"?[WINf()*10,250]:[250,WINf()*10];}
function band(a,b,fill){const[p1,p2]=[P(0,b),P(25,a)];return `<rect x="${Math.min(p1[0],p2[0])}" y="${Math.min(p1[1],p2[1])}" width="${Math.abs(p2[0]-p1[0])}" height="${Math.abs(p2[1]-p1[1])}" fill="${fill}"/>`;}
function yline(yd,st){const[a,b]=[P(0,yd),P(25,yd)];return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${st}/>`;}

/* ---------------- lógica de la jugada ---------------- */
const anulada=j=>j.pf&&(j.facc==="falta"||j.fq==="A");
function endYd(j,g){if(j.yd!=null&&((j.tipo==="pase"&&j.res==="C")||j.tipo==="corr"||j.tipo==="sack"))return g.spot+j.yd;if(j.tipo==="pase"){if(j.res!=="C")return g.spot;const p=j.fin||j.pt;return p?p[1]:null;}if(j.tipo==="corr"||j.tipo==="sack")return j.fin?j.fin[1]:null;return null;}
function gain(j,g){const e=endYd(j,g);return e==null?null:Math.round(e-g.spot);}
function isTD(j,g){if(j.tipo==="sack")return false;if(j.tipo==="pase"&&j.res!=="C")return false;const e=endYd(j,g);return e!=null&&e>=50;}
const isPick=j=>j.tipo==="pase"&&j.res==="X"&&(j.pick||(j.ret&&j.ret[1]<0));
function faltaSpot(j,g){if(j.fq==="A")return g.spot;const sgn=(j.fq==="F")===(g.side==="o")?-1:1;let ns;if(j.fy==="spot"&&j.fsp)ns=Math.round(j.fsp[1]);else{ns=g.spot+sgn*(+j.fy||0);if(ns<1)ns=Math.max(1,Math.round(g.spot/2));}return Math.min(49,Math.max(1,ns));}
function need(){
 if(UI.mover)return "spot";
 if(J.tipo==="pase"&&!J.pt&&J.yd==null)return "pt";
 if((J.tipo==="falta"||J.pf)&&J.fy==="spot"&&!J.fsp)return "fsp";
 if(J.tipo==="pase"&&J.res==="C"&&!J.fin&&J.yd==null)return "fin";
 if(J.tipo==="pase"&&J.res==="X"&&!J.ret&&!J.pick)return "ret";
 if((J.tipo==="corr"||J.tipo==="sack")&&!J.fin&&J.yd==null)return "fin";
 return null;}
function listo(){const o=G.side==="o";
 if(J.pf&&!(J.fq&&(J.fq!=="F"||J.fj)&&(J.fy!=="spot"||J.fsp)))return false;
 if(J.tipo==="falta")return !!J.fq&&(J.fq!=="F"||!!J.fj)&&(J.fy!=="spot"||!!J.fsp);
 if(anulada(J))return true;
 if(J.tipo==="pase"){if(!J.res)return false;if(o&&!J.pas)return false;if(o&&!J.rec&&J.res!=="X"&&J.res!=="I")return false;if(!o&&(J.res==="F"||J.res==="X")&&!J.def)return false;return true;}
 if(J.tipo==="corr")return !o||!!J.cor;
 if(J.tipo==="sack")return o?!!J.pas:!!J.def;
 return false;}

/* Aplica una jugada: actualiza el partido y arma las filas para Off / Def con las mismas columnas de siempre. */
function apply(g,j){
 const o=g.side==="o",gn=gain(j,g),td=isTD(j,g),air=j.pt?Math.round(j.pt[1]-g.spot):"",an=anulada(j),pe=g.pe!==null,pk=isPick(j);
 g.n++;
 const pen=String(j.tt||"").startsWith("Extra")?"si":"";
 const base={Partido:UI.match?UI.match.id:"",jugada:g.n,tiempo:j.tt||"",down:pe?"PE":g.down===null?"":g.down,spot:g.spot,penales:pen,"tipo jugada":j.tipo==="corr"?"corrida":j.tipo,resultado:j.tipo==="pase"?j.res:""};
 if(j.pt)base["recep x,y"]=j.pt.join(",");if(j.fin)base["fin x,y"]=j.fin.join(",");if(j.pt)base["yd aire"]=air;
 if(j.yd!=null&&!j.pt&&!j.fin)base.ubicacion="yardas a mano";else if((j.tipo==="pase"&&j.res==="C"&&!j.pt)||((j.tipo==="corr"||j.tipo==="sack")&&!j.fin))base.ubicacion="pendiente";
 if(j.tipo==="falta"||j.pf){base["tipo falta"]=j.fq==="A"?"Ambos equipos (compensadas)":(j.ft||"");if(j.pf)base["falta aceptada"]=an?"falta":"jugada";}
 const off=[],def=[];
 if(o){const r=Object.assign({},base);
  if(!an){
   if(j.tipo==="pase"){
    if(pe){ // punto extra de pase: solo columnas de PE (no suman al pase normal)
     if(td){r["pt ext"]=g.pe;r["jugador p ext"]=j.rec;r["asist p ext"]=j.pas;}
     else{r["pt ext"]=0;r["motivo pe"]=j.res==="I"?"incompleto":j.res==="D"?"drop":j.res==="X"?"intercepcion":"flag";r["pasador pe fallado"]=j.pas;if(j.rec&&j.res!=="X")r["jugador pe fallado"]=j.rec;if(j.res==="X")r.intercep=j.pas;}
     if(j.res==="C"&&j.am){r["amague jg"]=j.rec;r.amagues=j.am;}}
    else{
     if(j.res==="C"){r.pasador=j.pas;r.receptor=j.rec;r["yd de pase"]=gn??"";r["yd ganadas recep"]=gn??"";if(j.am){r["amague jg"]=j.rec;r.amagues=j.am;}if(td){r["td jugador"]=j.rec;r["asistencia td"]=j.pas;}}
     if(j.res==="I")r["pas inc"]=j.pas;
     if(j.res==="D"){r.drop=j.rec;r["pas inc"]=j.pas;}
     if(j.res==="X"){r.intercep=j.pas;r["pas inc"]=j.pas;}}
    if(pk)r[pe?"pick 2 rival":"pick 6 rival"]=1;}
   if(j.tipo==="corr"){
    if(pe){if(td){r["pt ext"]=g.pe;r["jugador p ext"]=j.cor;}else{r["pt ext"]=0;r["motivo pe"]="flag";r["jugador pe fallado"]=j.cor;}}
    else{r.corredor=j.cor;r["yd corrida"]=gn??"";if(td)r["td jugador"]=j.cor;}
    if(j.am){r["amague jg"]=j.cor;r.amagues=j.am;}}
   if(j.tipo==="sack")r.sack=j.pas;}
  if(j.tipo==="falta"||j.pf){if(j.fq==="F")r["falta jugador"]=j.fj;else if(j.fq==="R")r["falta recibida"]=j.fj||"";}
  if(an)r["jugada anulada"]=j.tipo;
  off.push(r);
  if(!an&&j.tipo==="pase"&&j.res==="X"){const mini=x=>Object.assign({Partido:base.Partido,jugada:g.n,tiempo:base.tiempo,down:base.down,spot:base.spot,penales:pen,situacion:pe?"PE":""},x);
   if(j.def&&!pk)def.push(mini({"flag capturado":j.def}));
   (j.fe||[]).forEach(n=>def.push(mini({"flag errado":n})));}}
 else{const r=Object.assign({},base);if(pe)r.situacion="PE";
  if(!an){
   if(j.tipo==="pase"){if(j.res==="C"&&!td&&j.def)r["flag capturado"]=j.def;if(j.res==="F")r["pase desviado"]=j.def;
    if(j.res==="X"){r.intercepcion=j.def;if(j.am)r.amagues=j.am;if(j.ret&&j.pt)r["yd intercep"]=Math.max(0,Math.round(j.pt[1]-j.ret[1]));if(pk)r[pe?"pick 2":"pick 6"]=j.def;}
    r["yd rival"]=j.res==="C"?(gn??""):0;}
   if(j.tipo==="corr"){if(!td&&j.def)r["flag capturado"]=j.def;r["yd rival"]=gn??"";}
   if(j.tipo==="sack"){r.sacks=j.def;r["yd rival"]=gn??"";}
   if(j.ret)r["devolucion x,y"]=j.ret.join(",");
   if(td)r[pe?"pe rival":"td rival"]=pe?g.pe:1;}
  if(j.tipo==="falta"||j.pf){if(j.fq==="F")r["faltas realizadas"]=j.fj;else if(j.fq==="R")r["faltas recibidas"]=j.fj||"";}
  if(an)r["jugada anulada"]=j.tipo;
  def.push(r);
  if(!an)(j.fe||[]).forEach(n=>def.push({Partido:base.Partido,jugada:g.n,tiempo:base.tiempo,down:base.down,spot:base.spot,penales:pen,situacion:pe?"PE":"","flag errado":n}));}
 // texto del listado
 let txt=j.tipo==="pase"?(j.res==="C"?(o?`#${j.pas} → #${j.rec}`:"Pase rival")+(gn==null?" completo":` ${gn} yd`):j.res==="X"?`Intercepción${!o&&j.def?" #"+j.def:""}`:j.res==="D"?`Drop #${j.rec}`:j.res==="F"?`Desvío #${j.def}`:"Incompleto"):j.tipo==="falta"?(j.fq==="A"?"Faltas de ambos":`Falta ${j.fq==="F"?"Fenix"+(j.fj?" #"+j.fj:""):"rival"}${j.ft?" · "+j.ft:""}`):j.tipo==="corr"?`Corrida ${o?"#"+j.cor:"rival"}${gn==null?"":" "+gn+" yd"}`:`Sack${o&&j.pas?" a #"+j.pas:!o&&j.def?" #"+j.def:""}${gn==null?"":" "+gn+" yd"}`;
 if(j.pf)txt+=j.fq==="A"?" + faltas de ambos":` + falta ${j.fq==="F"?"Fenix":"rival"}${an?" (aceptada)":" (declinada)"}`;
 if(o&&j.tipo==="pase"&&j.res==="X"&&j.def&&!pk)txt+=` · flag #${j.def}`;
 if(j.fe&&j.fe.length&&(!o||(j.tipo==="pase"&&j.res==="X")))txt+=` · erró: #${j.fe.join(", #")}`;
 let tag="",tc="";
 const e=endYd(j,g);
 const safety=!an&&!pe&&(j.tipo==="corr"||j.tipo==="sack"||(j.tipo==="pase"&&j.res==="C"))&&e!=null&&e<0;
 const cambia=()=>{g.spot=5;g.down=1;g.side=o?"d":"o";txt+=" · cambia la posesión";};
 if(j.tipo==="falta"||an){g.spot=faltaSpot(j,g);const fd=j.fq==="A"?"rep":j.fd;if(fd==="auto")g.down=1;else if(fd==="pierde"&&g.down!==null)g.down=Math.min(4,g.down+1);tag="FALTA";tc="#FACC15";}
 else if(safety){g.sc[o?"r":"f"]+=2;tag="SAFETY";tc="var(--err)";if(!o&&def[0])def[0].safety=j.def||"si";cambia();}
 else if(pk&&pe){g.sc[o?"r":"f"]+=2;tag="PICK 2";tc="var(--int)";g.pe=null;cambia();}
 else if(pk){g.sc[o?"r":"f"]+=6;tag="PICK 6";tc="var(--int)";g.side=o?"d":"o";g.pe="?";g.down=1;}
 else if(pe){if(td){g.sc[o?"f":"r"]+=g.pe;tag="+"+g.pe;tc="var(--ok)";}else{tag="PE ✕";tc="var(--err)";}g.pe=null;cambia();}
 else if(td){g.sc[o?"f":"r"]+=6;tag="TD";tc="var(--ok)";g.pe="?";}
 else if(j.res==="X"){tag="INT";tc="var(--int)";cambia();}
 else{
  if(e==null){tag="SIN UBIC.";tc="#FACC15";if(g.down!==null)g.down++;}
  else if(g.spot<25&&e>=25){g.down=1;tag="1° DOWN";tc="#FACC15";g.spot=Math.round(e);}
  else{g.spot=Math.max(1,Math.round(e));if(g.down!==null)g.down++;}
  if(g.down!==null&&g.down>4){tag="4° ✕";tc="var(--err)";cambia();}}
 return {off,def,log:{d:(pe?"PE":base.down===""?"–":base.down+"°")+" · "+yLblSpot(base.spot),txt,tag,tc,o}};}
function applyAdj(g,a){if(!a)return;if("down" in a&&!a.side)g.down=a.down;if(a.side){g.side=a.side;g.spot=5;g.down=1;g.pe=null;}if(a.pe){g.pe=a.pe;g.spot=a.pe===1?45:40;}else if("pe" in a&&a.pe===null)g.pe=null;if(a.spot!=null)g.spot=a.spot;if("down" in a&&a.side)g.down=a.down;}
function push(j,adj){const pre=clone(G);const res=apply(G,clone(j));PLAYS.push({pre,inp:clone(j),adj:adj?clone(adj):null,off:res.off,def:res.def,log:res.log,post:clone(G)});}
function rebuild(list,pend){G=G0();PLAYS=[];list.forEach(p=>{applyAdj(G,p.adj);push(p.inp,p.adj);});UI.adj=pend||null;if(pend)applyAdj(G,pend);}
function savePlay(){
 if(!J.tt)J.tt=UI.per+" "+fmt(UI.dur-UI.t);
 if(UI.edit!==null){const i=UI.edit,rest=PLAYS.slice(i+1),adj=PLAYS[i].adj;PLAYS=PLAYS.slice(0,i);
  G=clone(PLAYS[i-1]?PLAYS[i-1].post:G0());applyAdj(G,adj);push(J,adj);
  rest.forEach(p=>{applyAdj(G,p.adj);push(p.inp,p.adj);});
  const pend=UI.saved&&UI.saved.adj;UI.edit=null;UI.saved=null;UI.adj=pend||null;if(pend)applyAdj(G,pend);}
 else{["pas","rec","cor","def","fj"].forEach(k=>{if(J[k]){FREQ[k]=FREQ[k]||{};FREQ[k][J[k]]=(FREQ[k][J[k]]||0)+1;}});
  const wasO=G.side==="o";push(J,UI.adj);UI.adj=null;
  if(wasO){if(J.tipo==="pase"||J.tipo==="sack"){UI.lastPas=J.pas;if(J.rec)UI.lastRec=J.rec;}if(J.tipo==="corr"&&J.cor)UI.lastCor=J.cor;}}
 UI.status="";J=J0();UI.pan=0;persist();draw();}
function delPlay(i){const d=PLAYS[i],rest=PLAYS.slice(i+1);PLAYS=PLAYS.slice(0,i);G=clone(PLAYS[i-1]?PLAYS[i-1].post:G0());
 if(rest.length)rest[0].adj=Object.assign({},d.adj||{},rest[0].adj||{});else UI.adj=Object.assign({},d.adj||{},UI.adj||{});
 rest.forEach(p=>{applyAdj(G,p.adj);push(p.inp,p.adj);});if(UI.adj&&Object.keys(UI.adj).length)applyAdj(G,UI.adj);persist();draw();}

/* ---------------- guardado local ---------------- */
const matchKey=m=>`fenixAnot3_${gender}_${season}_${m.id}`;
function persist(){if(!UI.match)return;LS.set(matchKey(UI.match),{plays:PLAYS.map(p=>({inp:p.inp,adj:p.adj})),pend:UI.adj,t:UI.t,per:UI.per,dur:UI.dur,last:{pas:UI.lastPas,rec:UI.lastRec,cor:UI.lastCor},freq:FREQ,rival:UI.match.rival,fecha:UI.match.fecha,uploaded:UI.match.uploaded||false});
 LS.set("fenixAnot3_cur_"+gender,{season,match:UI.match});}
function loadMatch(m){UI.match=m;const st=LS.get(matchKey(m),null);
 UI.run=false;clearInterval(tm);UI.edit=null;UI.saved=null;UI.status="";UI.pick=null;
 if(st){UI.t=st.t??20*60;UI.per=st.per||"1T";UI.dur=st.dur||20*60;UI.lastPas=st.last&&st.last.pas||null;UI.lastRec=st.last&&st.last.rec||null;UI.lastCor=st.last&&st.last.cor||null;FREQ=st.freq||{};m.uploaded=st.uploaded||m.uploaded;rebuild(st.plays||[],st.pend||null);}
 else{UI.t=UI.dur;UI.per="1T";UI.lastPas=null;UI.lastRec=null;UI.lastCor=null;FREQ={};G=G0();PLAYS=[];UI.adj=null;}
 J=J0();persist();}
const pendingCount=id=>{const st=LS.get(`fenixAnot3_${gender}_${season}_${id}`,null);return st&&st.plays?st.plays.length:0;};
const uploadedFlag=id=>{const st=LS.get(`fenixAnot3_${gender}_${season}_${id}`,null);return !!(st&&st.uploaded);};

/* ---------------- datos (Índice, fixture, plantel) ---------------- */
function parseCSV(t){const R=[];let r=[],f="",q=false;t=(t||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===","){r.push(f);f="";}else if(c==="\n"){r.push(f);R.push(r);r=[];f="";}else f+=c;}}if(f.length||r.length){r.push(f);R.push(r);}return R.filter(x=>x.some(y=>y.trim()!==""));}
async function fetchTab(sheetId,tab){const url=`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;const txt=await fetch(url).then(r=>r.ok?r.text():"");return parseCSV(txt);}
const tableOf=rows=>{if(!rows||rows.length<2)return null;const h=rows[0].map(x=>x.trim());const I={};h.forEach((x,i)=>{I[x]=i;I[nkey(x)]=i;});return {I,rows:rows.slice(1),col:(r,n)=>{const i=I[n]??I[nkey(n)];return i==null?"":String(r[i]??"").trim();}};};
function extractSheetId(x){x=(x||"").trim();const m=x.match(/\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:x;}
async function loadIndex(){try{const t=tableOf(await fetchTab(CONFIG.INDEX_ID,"Indice"));if(!t){INDEX=null;return;}
 INDEX=t.rows.map(r=>({temporada:t.col(r,"Temporada"),genero:t.col(r,"Genero"),id:extractSheetId(t.col(r,"Planilla")),activa:(t.col(r,"Activa")||"SI").toUpperCase()})).filter(x=>x.temporada&&x.id&&x.activa!=="NO");if(!INDEX.length)INDEX=null;}catch(e){INDEX=null;}}
function seasonsForGender(){if(!INDEX)return[];const gg=gender==="f"?"femenino":"masculino";return [...new Set(INDEX.filter(r=>nkey(r.genero)===gg).map(r=>r.temporada))].sort().reverse();}
function sheetIdFor(){if(INDEX){const gg=gender==="f"?"femenino":"masculino";const row=INDEX.find(r=>r.temporada===season&&nkey(r.genero)===gg);if(row)return row.id;}return gender==="f"?CONFIG.SHEET_ID_F:CONFIG.SHEET_ID;}
async function loadFixture(){const sid=sheetIdFor();let games=[];const done=new Set();
 try{const t=tableOf(await fetchTab(sid,"Fixture"));if(t)t.rows.forEach(r=>{const lo=t.col(r,"Local"),vi=t.col(r,"Visitante");let rival=null;if(nkey(lo)==="fenix")rival=vi;else if(nkey(vi)==="fenix")rival=lo;else return;
  games.push({id:t.col(r,"ID"),fecha:t.col(r,"Fecha"),rival});});}catch(e){}
 try{const t=tableOf(await fetchTab(sid,"Off"));if(t)t.rows.forEach(r=>{const v=t.col(r,"Partido");if(v)done.add(v);});}catch(e){}
 games.forEach(g=>g.hasData=done.has(g.id));FIXGAMES=games;LS.set(`fenixFix3_${gender}_${season}`,games);
 try{const t=tableOf(await fetchTab(sid,"Equipos"));LOGOS={};if(t)t.rows.forEach(r=>{const n=t.col(r,"Equipo"),l=t.col(r,"Logo");if(n&&l)LOGOS[nkey(n)]=l;});LS.set(`fenixLogos3_${gender}_${season}`,LOGOS);}catch(e){}}
async function loadRoster(){const sid=sheetIdFor();let bib={};
 try{const t=tableOf(await fetchTab(CONFIG.INDEX_ID,"Biblioteca_Jugadores"));if(t)t.rows.forEach(r=>{const id=t.col(r,"ID");if(!id)return;const pp=[t.col(r,"Posicion")].concat(t.col(r,"Posiciones").split(/[,;/]+/)).map(x=>x.trim().toUpperCase()).filter(Boolean);bib[id]={main:pp[0]||"",all:pp};});}catch(e){}
 try{const t=tableOf(await fetchTab(sid,CONFIG.TAB_PLANTEL));if(t){const list=t.rows.map(r=>{const n=parseInt(String(t.col(r,"Numero")).replace("#",""),10);const jid=t.col(r,"JugadorID");const b=bib[jid];const pos=(t.col(r,"Posicion")||"").toUpperCase();
   return {n:isNaN(n)?null:String(n),name:t.col(r,"Nombre"),main:b?b.main:pos,all:b?b.all:[pos]};}).filter(p=>p.n!=null);
  if(list.length){ROSTER=list.sort((a,b)=>a.n-b.n);LS.set(`fenixRoster3_${gender}_${season}`,ROSTER);}}}catch(e){}
 setRoster();}
function shortName(nm){const p=String(nm||"").trim().split(/\s+/);return p.length>1?p[0]+" "+p[p.length-1][0]+".":p[0]||"";}
function setRoster(){MIO=ROSTER.map(p=>[p.n,shortName(p.name)]);
 const qMain=ROSTER.filter(p=>p.main==="QB").map(p=>p.n),qSec=ROSTER.filter(p=>p.main!=="QB"&&p.all.includes("QB")).map(p=>p.n);QBS=qMain.concat(qSec);
 PASAN=QBS.map(n=>{const p=ROSTER.find(x=>x.n===n);return [n,shortName(p.name)+" · QB"];}).concat(MIO.filter(x=>!QBS.includes(x[0])));
 if(J&&!J.tipo&&!J.pas)J.pas=UI.lastPas||QBS[0]||null;}

/* ---------------- dibujo ---------------- */
const flagIco=(x,y)=>`<g transform="translate(${x},${y})"><line y1="0" y2="-16" stroke="#F4F2EE" stroke-width="2"/><path d="M0,-16 L11,-12 L0,-8Z" fill="${G.side==="o"?"#B8B2F5":"#F97316"}"/></g>`;
function field(){
 const w0=W0(),win=WINf(),[W,H]=DIM(),inW=yd=>yd>=w0&&yd<=w0+win;let h=`<rect width="${W}" height="${H}" fill="#1B3A22"/>`;
 h+=band(Math.max(-10,w0),0,G.side==="o"?"rgba(249,115,22,.10)":"rgba(184,178,245,.16)");
 if(w0+win>50)h+=band(50,Math.min(60,w0+win),G.side==="o"?"rgba(249,115,22,.22)":"rgba(184,178,245,.10)");
 [[20,25],[45,50]].forEach(([a,b])=>{if(b>w0&&a<w0+win)h+=band(Math.max(a,w0),b,"url(#hatch)");});
 for(let yd=-10;yd<=60;yd+=5){if(!inW(yd))continue;const goal=yd===0||yd===50,mid=yd===25;
  h+=yline(yd,`stroke="${goal||mid?"rgba(255,255,255,.75)":"rgba(255,255,255,.18)"}" stroke-width="${goal||mid?2:1}"`);
  if(yd>0&&yd<50){const[a,b]=UI.ori==="h"?[P(1.2,yd),P(24.2,yd)]:[P(0.6,yd-0.3),P(24.4,yd-0.3)];
   h+=`<text class="yn" x="${a[0]}" y="${a[1]}" text-anchor="${UI.ori==="h"?"middle":"start"}">${yLbl(yd)}</text><text class="yn" x="${b[0]}" y="${b[1]}" text-anchor="${UI.ori==="h"?"middle":"end"}">${yLbl(yd)}</text>`;}}
 if(w0+win>=52){const[c0,c1]=P(12.5,55);h+=`<text x="${c0}" y="${c1+5}" text-anchor="middle" ${UI.ori==="h"?`transform="rotate(-90 ${c0} ${c1})"`:""} style="font:800 16px var(--fd);letter-spacing:.3em;fill:rgba(255,255,255,.35)">TOUCHDOWN</text>`;}
 h+=yline(G.spot,'stroke="#FDBA74" stroke-width="2" stroke-dasharray="6 5"');
 if(G.pe===null&&G.spot<25)h+=yline(25,'stroke="#FACC15" stroke-width="2.5" opacity=".8"');
 const[bx,by]=P(12.5,G.spot);h+=`<ellipse cx="${bx}" cy="${by}" rx="${UI.ori==="h"?4:6}" ry="${UI.ori==="h"?6:4}" fill="#8B4513" stroke="#F4F2EE" stroke-width="1"/>`;
 const[qx,qy]=P(12.5,G.spot-(J.tipo==="pase"||J.tipo==="sack"?3:1.2));
 const col=J.res==="C"?"#4ADE80":J.res==="I"||J.res==="D"||J.res==="F"?"#F87171":J.res==="X"?"#60A5FA":"#F4F2EE";
 const qb=`<circle cx="${qx}" cy="${qy}" r="8" fill="${G.side==="o"?"#F97316":"#B8B2F5"}"/>`;
 if(J.tipo==="pase"){
  h+=qb+`<text x="${qx}" y="${qy+3}" text-anchor="middle" style="font:800 8px var(--fm);fill:#111">${G.side==="o"?(J.pas||""):"QB"}</text>`;
  if(J.pt){const[x,y]=P(...J.pt);h+=`<line x1="${qx}" y1="${qy}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="2.5" ${J.res&&J.res!=="C"?'stroke-dasharray="5 4"':''}/><circle cx="${x}" cy="${y}" r="7" fill="${col}" stroke="#0E0F12" stroke-width="2"/>`;
   if(J.res==="C"&&!J.fin)h+=flagIco(x,y-9);
   if(J.ret){const[rx,ry]=P(...J.ret);h+=`<line x1="${x}" y1="${y}" x2="${rx}" y2="${ry}" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/><circle cx="${rx}" cy="${ry}" r="5" fill="#60A5FA"/>`;}
   if(J.fin){const[fx,fy]=P(...J.fin);h+=`<line x1="${x}" y1="${y}" x2="${fx}" y2="${fy}" stroke="${col}" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>${flagIco(fx,fy)}`;}}}
 if(J.tipo==="corr"||J.tipo==="sack"){h+=qb;
  if(J.fin){const[fx,fy]=P(...J.fin);h+=`<line x1="${qx}" y1="${qy}" x2="${fx}" y2="${fy}" stroke="${J.tipo==="sack"?"#F87171":"#FDBA74"}" stroke-width="3"/>${flagIco(fx,fy)}`;}}
 if(J.fsp){const[fx,fy]=P(...J.fsp);h+=`<path d="M${fx-7},${fy+6} L${fx},${fy-8} L${fx+7},${fy+6}Z" fill="#FACC15"/>`;}
 const st=UI.ori==="h"?"width:100%;height:auto":"height:clamp(300px,calc(100svh - 300px),470px);width:auto;max-width:100%;margin:0 auto";
 return `<svg class="field ${UI.ori}" id="fld" viewBox="0 0 ${W} ${H}" style="${st}"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="8" stroke="rgba(255,255,255,.06)" stroke-width="4"/></pattern></defs>${h}</svg>`;}
function ask(){if(!UI.match)return "Elegí el <b>partido</b> arriba";if(G.pe==="?")return "Elegí el <b>punto extra</b>";const n=need();
 if(n==="spot")return "Tocá dónde queda la <b>pelota</b>";
 if(n==="pt")return J.res==="C"?"Tocá dónde <b>recibió</b> · o guardá sin ubicación":"Tocá dónde fue la <b>pelota</b> (opcional)";
 if(n==="fsp")return "Tocá dónde fue la <b>falta</b>";
 if(n==="fin"&&J.tipo==="pase")return "Listo para guardar · si <b>avanzó</b>, tocá dónde le sacaron el flag";
 if(n==="ret")return "Opcional: tocá dónde terminó la <b>devolución</b>";
 if(n==="fin")return J.tipo==="sack"?"Tocá dónde quedó el <b>QB</b>":"Tocá dónde le sacaron el <b>flag</b> (o la zona de TD)";
 if(J.tipo&&(J.pt||J.fin||J.fsp))return "Listo · tocá de nuevo para volver a marcar";
 return "";}
const PICKS={};
function NUMS(lbl,key,list,d){PICKS[key]={lbl,list,d};const cur=list.find(x=>x[0]===J[key]);
 return `<div class="lab">${lbl}</div><button class="pbtn${d?" d":""}${cur?" on":""}" data-a="pickopen" data-k="${key}">${cur?`<b>${cur[0]}</b><span>${esc(cur[1])}</span>`:`<span class="ph">Elegir jugador</span>`}<i>▾</i></button>`;}
function MULTI(lbl,key,list,d){PICKS[key]={lbl,list,d,multi:true};const sel=list.filter(x=>(J[key]||[]).includes(x[0]));
 return `<div class="lab">${lbl}</div><button class="pbtn${d?" d":""}${sel.length?" on":""}" data-a="pickopen" data-k="${key}">${sel.length===1?`<b>${sel[0][0]}</b><span>${esc(sel[0][1])}</span>`:sel.length?`<b>${sel.length}</b><span class="multi">${sel.map(x=>"#"+x[0]+" "+esc(x[1])).join(" · ")}</span>`:`<span class="ph">Nadie · elegir uno o varios</span>`}<i>▾</i></button>`;}
function pickSheet(){const P=PICKS[UI.pick];if(!P)return "";
 if(P.multi){const cur=J[UI.pick]||[];return `<div class="bsback" data-a="pickclose"></div><div class="bsheet"><div class="bsh"><span>${P.lbl}</span><button class="fx" data-a="pickclose">Listo</button></div><div class="bsgrid">${P.list.length?P.list.map(([n,nm])=>`<button class="bst${P.d?" d":""} ${cur.includes(n)?"on":""}" data-a="pickmulti" data-k="${UI.pick}" data-v="${n}"><b>${n}</b><span>${esc(nm)}</span></button>`).join(""):'<p class="empty" style="grid-column:1/-1">No hay plantel cargado para este torneo.</p>'}</div><div class="bsfoot"><button class="btn ghost" data-a="pickclear" data-k="${UI.pick}" ${cur.length?"":"disabled"}>Ninguno</button><button class="btn pri" data-a="pickclose">Listo${cur.length?" ("+cur.length+")":""}</button></div></div>`;}
 return `<div class="bsback" data-a="pickclose"></div><div class="bsheet"><div class="bsh"><span>${P.lbl}</span><button class="fx" data-a="pickclose">Cerrar</button></div><div class="bsgrid">${P.list.length?P.list.map(([n,nm])=>`<button class="bst${P.d?" d":""} ${J[UI.pick]===n?"on":""}" data-a="pickset" data-k="${UI.pick}" data-v="${n}"><b>${n}</b><span>${esc(nm)}</span></button>`).join(""):'<p class="empty" style="grid-column:1/-1">No hay plantel cargado para este torneo.</p>'}</div></div>`;}
const teamLogo=(name,cls,ab)=>{const l=name==="Fenix"?LOGO:LOGOS[nkey(name)];return `<span class="lg ${cls}">${l?`<img src="${esc(l)}" alt="" onerror="this.remove()">`:""}<em>${ab}</em></span>`;};
function scoreHTML(){const riv=rivalName(),ab=riv.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ]/g,"").slice(0,3).toUpperCase()||"RIV",pp=`<button class="pp" data-a="clk" aria-label="${UI.run?"Pausar":"Iniciar"} reloj">${UI.run?"❚❚":"▶"}</button>`;
 return `<div class="sb-tv"><div class="tm f">${teamLogo("Fenix","f","FNX")}<span class="nm">Fenix</span><b>${G.sc.f}</b></div>
  <div class="mid" data-a="clkedit"><span class="per">${UI.per} · ✎</span><b class="clkt">${fmt(UI.t)}</b>${pp}</div>
  <div class="tm r">${teamLogo(riv,"r",ab)}<span class="nm">${esc(riv)}</span><b>${G.sc.r}</b></div></div>`;}
const ydc=()=>{const g=gain(J,G);const v=J.yd!=null?J.yd:g;return `<div class="lab">Yardas ganadas <span class="src">${J.yd!=null?"a mano":g!=null?"del mapa":""}</span></div><div class="row"><button class="btn" data-a="yd" data-v="-1">−</button><input class="ydin" type="number" inputmode="numeric" placeholder="–" value="${v==null?"":v}" aria-label="Yardas ganadas"><button class="btn" data-a="yd" data-v="1">+</button></div>`;};
const amg=l=>`<div class="lab">${l}</div><div class="row"><button class="btn" data-a="am" data-v="-1">−</button><button class="btn" disabled style="opacity:1">${J.am}</button><button class="btn" data-a="am" data-v="1">+</button></div>`;
const flagsDef=(lbl,capt=true)=>(capt?NUMS(lbl||"Quién sacó el flag (opcional)","def",MIO,true):"")+MULTI("Erraron el flag (opcional)","fe",MIO,true);
function faltaForm(){const o=G.side==="o";let h="";
 const tipos=["Salida en falso","Offside","Interferencia","Contacto ilegal","Protección de flag","Demora","Antideportiva","Otra"];
 h+=`<div class="lab">¿De quién es la falta?</div><div class="row">${[["F","Fenix"],["R","Rival"],["A","Ambos"]].map(([k,l])=>`<button class="btn ${J.fq===k?"on":""}" data-a="set" data-k="fq" data-v="${k}">${l}</button>`).join("")}</div>`;
 if(J.fq==="A")return h+`<div class="sum" style="color:var(--muted);margin-bottom:8px">Se compensan: la jugada no cuenta y se repite el down.</div>`;
 h+=NUMS(J.fq==="F"?"Quién la hizo":"A quién se la hicieron (opcional)","fj",MIO,!o);
 h+=`<div class="lab">Tipo</div><div class="row">${tipos.map(t=>`<button class="num ${J.ft===t?"on":""}" style="font:600 12px var(--fb);padding:0 8px" data-a="set" data-k="ft" data-v="${t}">${t}</button>`).join("")}</div>`;
 h+=`<div class="lab">Yardas</div><div class="row">${[["5","5 yd"],["10","10 yd"],["spot","En el lugar"]].map(([k,l])=>`<button class="btn ${String(J.fy)===k?"on":""}" data-a="set" data-k="fy" data-v="${k}">${l}</button>`).join("")}</div>`;
 h+=`<div class="lab">Down</div><div class="row">${[["rep","Repite"],["auto","1° automático"],["pierde","Pierde down"]].map(([k,l])=>`<button class="btn ${J.fd===k?"on":""}" data-a="set" data-k="fd" data-v="${k}">${l}</button>`).join("")}</div>`;
 return h;}
function sheet(){
 const o=G.side==="o";let h="";
 if(!J.tipo)return `<p class="empty" style="margin:2px 0;text-align:center">Elegí el tipo de jugada en la barra de abajo.</p>`;
 if(J.tipo==="pase"){
  const R=o?[["I","Incomp.","no"],["D","Drop","no"],["X","Intercep.","ix"]]:[["I","Incomp.","no"],["F","Desviado","no"],["X","Intercep.","ix"]];
  const rb=([k,l,c])=>`<button class="btn ${c} ${J.res===k?"on":""}" data-a="set" data-k="res" data-v="${k}">${l}</button>`;
  h+=`<div class="lab">Resultado</div><div class="row">${rb(["C","Completo","ok"])}</div><div class="row r3">${R.map(rb).join("")}</div>`;
  if(o){h+=NUMS("Pasa","pas",PASAN);if(J.res!=="X")h+=NUMS("Receptor","rec",MIO.filter(x=>x[0]!==J.pas));if(J.res==="C"){h+=ydc();h+=amg("Amagues del receptor");}}
  else{
   if(J.res==="F"||J.res==="X")h+=NUMS(J.res==="F"?"Quién desvió":"Quién interceptó","def",MIO,true);
   if(J.res==="X")h+=amg("Amagues en la devolución");
   if(J.res==="C")h+=ydc();
   if(J.res==="C"&&!isTD(J,G))h+=flagsDef();}
  if(J.res==="X"){const pk=G.pe!==null?"Pick 2":"Pick 6",auto=J.ret&&J.ret[1]<0;h+=`<div class="row" style="margin-top:10px"><button class="btn ix ${J.pick||auto?"on":""}" data-a="pick6" ${auto?"disabled style=\"opacity:1\"":""}>${pk}${auto?" · por el mapa":""}</button></div>`;
   if(o)h+=flagsDef("Quién le sacó el flag al que interceptó (opcional)",!(J.pick||auto));}
 }
 if(J.tipo==="corr"){if(o){h+=NUMS("Corre","cor",MIO);h+=ydc();h+=amg("Amagues");}else{h+=ydc();if(!isTD(J,G))h+=flagsDef();}}
 if(J.tipo==="sack"){if(o)h+=NUMS("QB","pas",PASAN);h+=ydc();if(!o)h+=NUMS("Quién hizo el sack","def",MIO,true);}
 if(J.tipo==="falta")h+=faltaForm();
 if(J.tipo!=="falta"){
  if(!J.pf)h+=`<div class="row"><button class="btn ghost" data-a="pf" style="border-color:rgba(250,204,21,.5);color:#FACC15">+ Falta en la jugada</button></div>`;
  else h+=`<div class="pfbox"><div class="row" style="justify-content:space-between;align-items:center"><span class="lab" style="width:auto;color:#FACC15">Falta en la jugada</span><button class="fx" data-a="pf">Quitar</button></div>${faltaForm()}${J.fq!=="A"?`<div class="lab">¿Qué se acepta?</div><div class="row"><button class="btn ${J.facc==="falta"?"on":""}" data-a="set" data-k="facc" data-v="falta">La falta</button><button class="btn ${J.facc==="jugada"?"on":""}" data-a="set" data-k="facc" data-v="jugada">La jugada</button></div>`:""}</div>`;}
 if(listo()){const g=gain(J,G),an=anulada(J);let t="";
  if(J.tipo==="pase"){const air=J.pt?Math.round(J.pt[1]-G.spot):null;const who=o?"#"+J.pas+" → #"+J.rec:"rival";
   t=J.res==="C"?(g==null?`Pase ${who} completo · <span style="color:#FACC15">sin ubicación (se completa después)</span>`:(air!=null&&J.yd==null?`Pase ${who}: <b>${air}</b> yd en el aire${g-air?` + <b>${g-air}</b> después`:""} = <b>${g}</b> yd`:`Pase ${who}: <b>${g}</b> yd${J.yd!=null?" (a mano)":""}`)):J.res==="X"?"Intercepción":J.res==="D"?`Drop de #${J.rec}`:J.res==="F"?"Pase desviado":"Pase incompleto";
   if(J.res==="C"&&J.am)t+=` · ${J.am} amague${J.am>1?"s":""}`;}
  if(J.tipo==="corr")t=g==null?`Corrida ${o?"#"+J.cor:"rival"} · <span style="color:#FACC15">sin ubicación</span>`:`Corrida ${o?"#"+J.cor:"rival"}: <b>${g}</b> yd${J.am?` · ${J.am} amague${J.am>1?"s":""}`:""}`;
  if(J.tipo==="sack")t=g==null?"Sack · sin ubicación":`Sack: <b>${g}</b> yd`;
  const intO=o&&J.tipo==="pase"&&J.res==="X";
  if(intO&&J.def&&!isPick(J))t+=` · #${J.def} le sacó el flag`;
  if((!o||intO)&&J.fe.length)t+=` · erró el flag: #${J.fe.join(", #")}`;
  if(!o&&(J.tipo==="corr"||(J.tipo==="pase"&&J.res==="C"))&&!J.def&&!isTD(J,G))t+=` · <span style="color:var(--muted)">sin flag marcado: terminó ahí</span>`;
  if(J.tipo==="falta"||J.pf){const ns=faltaSpot(J,G);const f=J.fq==="A"?"Faltas de ambos: se compensan, se repite el down":`Falta ${J.fq==="F"?"de Fenix":"del rival"}${J.fj?" (#"+J.fj+")":""}${J.ft?" · "+J.ft:""}: `+(J.tipo==="falta"||an?`pelota a la ${yLblSpot(ns)}, ${J.fd==="auto"?"1° down":J.fd==="pierde"?"pierde el down":"repite el down"}`:"se acepta la jugada");
   t=J.tipo==="falta"||an?`<span style="color:#FACC15">${f}</span>`:t+`<br><span style="color:#FACC15">${f}</span>`;}
  if(!an){const e=endYd(J,G);if(isPick(J))t+=` · <b style="color:var(--int)">${G.pe!==null?"PICK 2":"PICK 6"}</b>`;
   if(J.tipo!=="falta"&&e!=null&&e<0&&(J.tipo!=="pase"||J.res==="C")&&G.pe===null)t+=` · <b style="color:var(--err)">SAFETY</b>`;
   if(isTD(J,G))t+=` · <b style="color:var(--ok)">${G.pe!==null?"PUNTO EXTRA":"TOUCHDOWN"}</b>`;}
  h+=`<div class="sum" style="margin:2px 0 8px">${t}</div>`;}
 return h;}

 ${UI.edit!==null?`<div class="editbar">Editando la jugada ${UI.edit+1}<button class="fx" data-a="canceledit">Cancelar edición</button></div>`:""}
 <div class="sit"><div class="side full"><span class="o ${G.side==="o"?"on":""}" data-a="side" data-v="o">Ofensiva</span><span class="d ${G.side==="d"?"on":""}" data-a="side" data-v="d">Defensiva</span></div></div>
 <div class="downs">${G.pe!==null?`<span class="dk">Down</span><span class="dpe">${G.pe==="?"?"Punto extra":"Punto extra · x"+G.pe}</span>${G.pe!=="?"?`<button class="fx" data-a="peoff">Quitar</button>`:""}`:`<span class="dk">Down</span>${[[null,"–"],[1,"1°"],[2,"2°"],[3,"3°"],[4,"4°"]].map(([d,l])=>`<button class="dsel ${G.down===d?"on":""}" data-a="down" data-v="${d===null?"":d}">${l}</button>`).join("")}<button class="dnext" data-a="peask">PE</button>`}</div>
 ${UI.peAsk?`<div class="peask"><span class="dk">Punto extra</span><button class="btn" data-a="pe" data-v="1">x1 · 5 yd</button><button class="btn" data-a="pe" data-v="2">x2 · 10 yd</button><button class="fx" data-a="peask">Cancelar</button></div>`:""}
 <div class="vbar"><div class="vw"><button class="vbtn" data-a="vmenu"><span class="dk">Vista</span>${(UI.ori==="h"?"Horizontal":"Vertical")+" · "+({zoom:"ancho pantalla",adelante:"dinámica",completa:"cancha completa"})[UI.vista]}<i>${UI.vmenu?"▴":"▾"}</i></button>
  ${UI.vmenu?`<div class="vmenu"><div class="dk">Orientación</div><div class="vseg">${[["v","Vertical"],["h","Horizontal"]].map(([k,l])=>`<button class="${UI.ori===k?"on":""}" data-a="ori" data-v="${k}">${l}</button>`).join("")}</div>
   <div class="dk" style="margin-top:10px">Zoom</div><div class="vseg">${[["zoom","Ancho pantalla"],["adelante","Dinámica"],["completa","Cancha completa"]].map(([k,l])=>`<button class="${UI.vista===k?"on":""}" data-a="vista" data-v="${k}">${l}</button>`).join("")}</div></div>`:""}</div>
  <button class="mv ${UI.mover?"on":""}" data-a="mover">Mover pelota</button></div>
 <div class="lay"><div><div class="ask">${a||""}</div><div class="fieldwrap">${fieldInner()}</div></div>
 <div class="sheet">${!m?'<p class="empty">Elegí un partido para empezar.</p>':G.pe==="?"?peSheet():sheet()}</div></div>
 <div class="plist" id="log"></div>
 ${UI.confirmClear?`<div class="confirm">¿Borrar las ${PLAYS.length} jugadas de este partido? <button class="btn no on" data-a="clearyes">Sí, vaciar</button><button class="btn ghost" data-a="clearask">No</button></div>`:""}
 ${UI.status?`<div class="status ${UI.statusKind}">${UI.status}</div>`:""}
 <div class="actions"><div class="tbar">${[["pase","Pase"],["corr","Corrida"],["sack","Sack"],["falta","Falta"]].map(([k,l])=>`<button class="btn${k==="falta"?" fl":""} ${J.tipo===k?"on":""}" data-a="tipo" data-v="${k}" ${m&&G.pe!=="?"?"":"disabled"}>${l}</button>`).join("")}</div><div class="abtns"><div class="pmw"><button class="btn" data-a="pmenu">Partido ${UI.pmenu?"▾":"▴"}</button>${UI.pmenu?`<div class="pmenu"><button data-a="matchpick">Elegir partido</button><button data-a="clearask" ${PLAYS.length?"":"disabled"}>Limpiar / vaciar</button><button data-a="export" ${PLAYS.length?"":"disabled"}>Exportar CSV</button><button data-a="finish" class="fin" ${PLAYS.length&&UI.edit===null?"":"disabled"}>Finalizar partido</button></div>`:""}</div><button class="btn ghost" data-a="${UI.edit!==null?"canceledit":"cancel"}" ${J.tipo||UI.edit!==null?"":"disabled"}>Cancelar</button><button class="btn pri" data-a="save" ${m&&J.tipo&&G.pe!=="?"&&listo()?"":"disabled"}>${UI.edit!==null?"Guardar cambios":"Guardar"}</button></div></div>`;
 document.getElementById("app").className="phone";
 if(UI.pick)document.getElementById("app").insertAdjacentHTML("beforeend",pickSheet());
 wireField();
 const ts=document.getElementById("tSel");if(ts)ts.onchange=()=>selectSeason(ts.value);
 renderLog();}
function renderLog(){
 const row=(p,i)=>{const l=p.log;return `<div style="border-left:3px solid ${l.o?"var(--accent)":"var(--def)"}${UI.edit===i?";outline:1px solid var(--accent)":""}"><i>${l.d}</i><span class="lt">${esc(l.txt)}</span>${l.tag?`<span class="tag" style="color:${l.tc};border:1px solid ${l.tc}">${l.tag}</span>`:'<span class="tag" style="border:0"></span>'}<span class="la">${UI.edit===null?`<button class="fx" data-a="edit" data-i="${i}">Editar</button><button class="del ${UI.delAsk===i?"sure":""}" data-a="del" data-i="${i}" aria-label="Borrar jugada">${UI.delAsk===i?"¿Borrar?":"✕"}</button>`:UI.edit===i?'<span class="fx" style="text-decoration:none;color:var(--accent-ink)">editando</span>':""}</span></div>`;};
 const el=document.getElementById("log");if(!el)return;
 if(!PLAYS.length){el.innerHTML='<div class="lab" style="margin-top:0">Última jugada</div><span class="empty">Todavía no hay jugadas.</span>';return;}
 const D=drives();const nO=D.filter(d=>d.side==="o").length,nD=D.length-nO,li=PLAYS.length-1;
 let h=`<div class="lab" style="margin-top:0">Última jugada</div><div class="log">${row(PLAYS[li],li)}</div>
 <div class="tot"><div><b>${PLAYS.length}</b> jugadas <span>(${nO} drive${nO===1?"":"s"} ofensiva | ${nD} drive${nD===1?"":"s"} defensiva)</span></div><button class="btn" data-a="showall">${UI.showAll?"Ocultar":"Ver"}</button></div>`;
 if(UI.showAll)h+=D.map((d,k)=>({d,k})).reverse().map(({d,k})=>{const ps=d.idx.map(i=>PLAYS[i]);const yd=ps.reduce((a,p)=>{const r=(p.off[0]||p.def[0]||{});const v=r["yd de pase"]!==undefined&&r["yd de pase"]!==""?r["yd de pase"]:r["yd corrida"]!==undefined&&r["yd corrida"]!==""?r["yd corrida"]:r["yd rival"];return a+(typeof v==="number"?v:0);},0);const end=ps.map(p=>p.log.tag).filter(t=>["TD","INT","PE ✕","4° ✕","SAFETY","PICK 6","PICK 2"].includes(t)||/^\+\d/.test(t)).join(" · ");
  return `<div class="drv ${d.side}"><div class="dh"><b>Drive ${k+1}</b> · ${d.side==="o"?"Ofensiva":"Defensiva"} · ${ps.length} jugada${ps.length===1?"":"s"} · ${yd} yd${end?` · <span>${end}</span>`:""}</div><div class="log">${d.idx.slice().reverse().map(i=>row(PLAYS[i],i)).join("")}</div></div>`;}).join("");
 el.innerHTML=h;}
function drives(){const D=[];PLAYS.forEach((p,i)=>{const sd=p.pre.side;if(!D.length||D[D.length-1].side!==sd)D.push({side:sd,idx:[]});D[D.length-1].idx.push(i);});return D;}
function tap(e){if(!UI.match||G.pe==="?")return;let n=need();if(!n&&!J.tipo)return;const b=document.getElementById("fld").getBoundingClientRect();
 let x,yd;if(UI.ori==="h"){yd=W0()+(e.clientX-b.left)/b.width*WINf();x=(e.clientY-b.top)/b.height*25;}else{x=(e.clientX-b.left)/b.width*25;yd=W0()+WINf()-(e.clientY-b.top)/b.height*WINf();}
 x=Math.max(0,Math.min(25,x));yd=Math.max(-10,Math.min(60,yd));const p=[+x.toFixed(1),+yd.toFixed(1)];
 if(!n){ // todo marcado: el nuevo toque pasa a ser el primer punto
  if(J.tipo==="pase"){J.pt=p;J.fin=null;J.ret=null;J.yd=null;}
  else if(J.tipo==="corr"||J.tipo==="sack"){J.fin=p;J.yd=null;}
  else if(J.fsp)J.fsp=p;
  draw();return;}
 if(n==="spot"){G.spot=Math.round(Math.min(49,Math.max(1,p[1])));UI.mover=false;UI.pan=0;addAdj({spot:G.spot});}
 else if(n==="pt"){J.pt=p;J.yd=null;}else if(n==="ret")J.ret=p;else if(n==="fsp")J.fsp=p;else{J.fin=p;J.yd=null;}
 draw();}

/* ---------------- filas, CSV y subida ---------------- */
function buildRows(){const off=[],def=[];const D=drives();const dn={};D.forEach((d,k)=>d.idx.forEach(i=>dn[i]=k+1));
 PLAYS.forEach((p,i)=>{p.off.forEach(r=>{r.drive=dn[i];off.push(OFF_HDR.map(k=>r[k]??""));});p.def.forEach(r=>{r.drive=dn[i];def.push(DEF_HDR.map(k=>r[k]??""));});});
 return {off,def};}
const csvOf=(hdr,rows)=>[hdr.join(",")].concat(rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(","))).join("\n");
function dl(name,hdr,rows){const b=new Blob([csvOf(hdr,rows)],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${UI.match.id}-${name}.csv`;document.body.appendChild(a);a.click();a.remove();}
function uploadUrl(){try{const c=JSON.parse(localStorage.getItem("fenixPanel.cfg")||"{}");if(c.apiUrl&&/\/exec$/.test(c.apiUrl.trim()))return c.apiUrl.trim();}catch(e){}return CONFIG.UPLOAD_URL;}
const destinoTxt=()=>`${gender==="f"?"Femenino":"Masculino"} · ${season||"(sin torneo)"}`;
function setStatus(html,kind){UI.status=html;UI.statusKind=kind||"";draw();}
async function finish(){
 if(!UI.match)return;const {off,def}=buildRows(),url=uploadUrl(),sid=sheetIdFor();
 setStatus(`Subiendo ${off.length} filas de ataque y ${def.length} de defensa a <b>${esc(destinoTxt())}</b>…`,"wait");
 let txt;try{const res=await fetch(url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({kind:"plays",gender,sheetId:sid,partido:UI.match.id,offHdr:OFF_HDR,defHdr:DEF_HDR,offRows:off,defRows:def,fenixScore:G.sc.f,rivalScore:G.sc.r})});txt=await res.text();}
 catch(e){return setStatus(`No se subió: no hubo respuesta del Apps Script (${esc(e.message)}). Las jugadas siguen guardadas en este celular.`,"err");}
 let j=null;try{j=JSON.parse(txt);}catch(e){}
 if(!j)return setStatus("No se subió: el Apps Script respondió algo que no es la API (¿URL vieja o permisos?). Las jugadas siguen guardadas en este celular.","err");
 if(!j.ok)return setStatus("No se subió: "+esc(j.error||"error desconocido")+". Las jugadas siguen guardadas en este celular.","err");
 UI.match.uploaded=true;persist();const g=FIXGAMES.find(x=>x.id===UI.match.id);if(g)g.hasData=true;
 setStatus(`✓ Subido: ${j.off} filas de ataque y ${j.def} de defensa · Fenix ${G.sc.f} – ${G.sc.r} ${esc(rivalName())}. ${j.score==="ok"?"Marcador guardado en el Fixture.":"Marcador no guardado ("+esc(j.score||"—")+")."}`,"ok");}

/* ---------------- eventos ---------------- */
document.getElementById("app").onchange=e=>{
 const ti=e.target.closest(".tin");if(ti){const n=Math.max(0,parseInt(ti.value,10)||0);const m=Math.floor(UI.t/60),sec=UI.t%60;UI.t=ti.dataset.t==="m"?Math.min(UI.dur,Math.min(99,n)*60+sec):Math.min(UI.dur,m*60+Math.min(59,n));persist();draw();return;}
 const y=e.target.closest(".ydin");if(y){const n=parseInt(y.value,10);J.yd=isNaN(n)?null:Math.max(-G.spot-10,Math.min(60-G.spot,n));draw();}};
document.getElementById("app").onclick=e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v;
 if(a==="pmenu"){UI.pmenu=!UI.pmenu;draw();return;}
 UI.pmenu=false;if(!["vmenu","vista","ori"].includes(a))UI.vmenu=false;if(a!=="del")UI.delAsk=null;
 if(a==="tipo"){if(!UI.match)return;if(J.tipo===v)return;if(J.tipo){const k={tt:J.tt};J=Object.assign(J0(),k);}J.tipo=v;if(v==="pase"){J.res="C";if(G.side==="o"&&!J.pas)J.pas=UI.lastPas||QBS[0]||null;}if(v==="falta"){J.fq="R";J.fy=5;J.fd="rep";}}
 if(a==="showall"){UI.showAll=!UI.showAll;draw();return;}
 if(a==="pickopen"){UI.pick=el.dataset.k;draw();return;}
 if(a==="pickclose"){UI.pick=null;draw();return;}
 if(a==="pickmulti"){const k=el.dataset.k,c=J[k]||[];J[k]=c.includes(v)?c.filter(x=>x!==v):c.concat(v);draw();return;}
 if(a==="pickclear"){J[el.dataset.k]=[];draw();return;}
 if(a==="pickset"){J[el.dataset.k]=v;UI.pick=null;draw();return;}
 if(a==="set"){const k=el.dataset.k;J[k]=J[k]===v&&!["res","fq","facc","fy","fd"].includes(k)?null:v;if(k==="res"&&v!=="C")J.fin=null;if(k==="res"){J.def=null;J.pick=false;J.ret=null;}if(k==="fq")J.fj=null;if(k==="fy")J.fsp=null;}
 if(a==="fe")J.fe=J.fe.includes(v)?J.fe.filter(x=>x!==v):J.fe.concat(v);
 if(a==="am")J.am=Math.max(0,J.am+ +v);
 if(a==="yd"){const cur=J.yd!=null?J.yd:(gain(J,G)??0);J.yd=Math.max(-G.spot-10,Math.min(60-G.spot,cur+ +v));}
 if(a==="cancel"){J=J0();}
 if(a==="pick6")J.pick=!J.pick;
 if(a==="pf"){J.pf=!J.pf;Object.assign(J,J.pf?{fq:G.side==="o"?"R":"F",fy:5,fd:G.side==="o"?"auto":"rep",facc:"falta",fj:null,ft:null,fsp:null}:{fq:null,fy:null,fd:null,fj:null,ft:null,fsp:null,facc:null});}
 if(a==="mover")UI.mover=!UI.mover;
 if(a==="down"){G.down=v===""?null:+v;addAdj({down:G.down});}
 if(a==="clkedit")UI.clkEdit=!UI.clkEdit;
 if(a==="per"&&v!==UI.per){UI.per=v;UI.t=UI.dur;persist();}
 if(a==="tadj"){UI.t=Math.max(0,Math.min(UI.dur,UI.t+ +v));persist();}
 if(a==="dur"){const was=UI.t===UI.dur;UI.dur=Math.max(60,Math.min(60*60,UI.dur+60*(+v)));UI.t=was?UI.dur:Math.min(UI.t,UI.dur);persist();}
 if(a==="peask")UI.peAsk=!UI.peAsk;
 if(a==="peoff"){G.pe=null;G.down=1;addAdj({pe:null,down:1});if(PLAYS.length&&PLAYS[PLAYS.length-1].post.pe==="?"){G.spot=5;G.side=G.side==="o"?"d":"o";addAdj({side:G.side,down:1});}}
 if(a==="vista"){UI.vista=v;UI.vmenu=false;UI.pan=0;}
 if(a==="vmenu"){UI.vmenu=!UI.vmenu;draw();return;}
 if(a==="ori"){UI.ori=v;UI.vmenu=false;UI.pan=0;}
 if(a==="side"){G.side=v;G.spot=5;G.down=1;G.pe=null;J=J0();addAdj({side:v,down:1});}
 if(a==="pe"){G.pe=+v;G.spot=v==="1"?45:40;UI.peAsk=false;addAdj({pe:+v});}
 if(a==="clk"){UI.run=!UI.run;clearInterval(tm);persist();if(UI.run)tm=setInterval(()=>{if(UI.t>0)UI.t--;else{UI.run=false;clearInterval(tm);draw();}document.querySelectorAll(".clkt").forEach(x=>x.textContent=fmt(UI.t));if(!document.activeElement||!document.activeElement.classList.contains("tin")){const tm_=document.querySelector('.tin[data-t="m"]'),ts_=document.querySelector('.tin[data-t="s"]');if(tm_)tm_.value=String(Math.floor(UI.t/60)).padStart(2,"0");if(ts_)ts_.value=String(UI.t%60).padStart(2,"0");}if(UI.t%5===0)persist();},1000);}
 if(a==="canceledit"){G=UI.saved.G;J=UI.saved.J;UI.adj=UI.saved.adj;UI.saved=null;UI.edit=null;}
 if(a==="edit"){const i=+el.dataset.i;if(UI.edit===null)UI.saved={G:clone(G),J:clone(J),adj:UI.adj?clone(UI.adj):null};UI.edit=i;G=clone(PLAYS[i].pre);J=clone(PLAYS[i].inp);UI.adj=null;draw();window.scrollTo({top:0,behavior:"smooth"});return;}
 if(a==="del"){const i=+el.dataset.i;if(UI.delAsk!==i){UI.delAsk=i;draw();return;}UI.delAsk=null;delPlay(i);return;}
 if(a==="clearask")UI.confirmClear=!UI.confirmClear;
 if(a==="clearyes"){PLAYS=[];G=G0();J=J0();UI.adj=null;UI.confirmClear=false;UI.status="";UI.t=UI.dur;UI.per="1T";UI.match.uploaded=false;persist();draw();return;}
 if(a==="export"){const {off,def}=buildRows();dl("Off",OFF_HDR,off);setTimeout(()=>dl("Def",DEF_HDR,def),300);UI.status=`⤓ Se descargaron ${esc(UI.match.id)}-Off.csv y ${esc(UI.match.id)}-Def.csv.`;UI.statusKind="";}
 if(a==="finish"){finish();return;}
 if(a==="matchpick"){UI.matchOpen=true;draw();window.scrollTo({top:0,behavior:"smooth"});return;}
 if(a==="matchclose")UI.matchOpen=false;
 if(a==="center")UI.pan=0;
 if(a==="gen"&&v!==gender){gender=v;RAW.set("fenixGender",gender);UI.match=null;boot();return;}
 if(a==="mpick"){const g=FIXGAMES.find(x=>x.id===v);if(!g)return;persist();loadMatch({id:g.id,fecha:g.fecha,rival:g.rival,uploaded:g.hasData});UI.matchOpen=false;}
 if(a==="mmanual"){const id=($("#mId").value||"").trim(),rv=($("#mRiv").value||"").trim()||"Rival";if(!id){$("#mId").focus();return;}persist();loadMatch({id,fecha:"",rival:rv});UI.matchOpen=false;}
 if(a==="save"){savePlay();return;}
 draw();};
async function selectSeason(s){document.activeElement&&document.activeElement.blur&&document.activeElement.blur();season=s;RAW.set("fenixTourn_"+gender,season);UI.match=null;await loadSeason();}
async function loadSeason(){
 FIXGAMES=LS.get(`fenixFix3_${gender}_${season}`,[]);LOGOS=LS.get(`fenixLogos3_${gender}_${season}`,{});ROSTER=LS.get(`fenixRoster3_${gender}_${season}`,[]);setRoster();
 const cur=LS.get("fenixAnot3_cur_"+gender,null);if(!UI.match&&cur&&cur.season===season&&cur.match)loadMatch(cur.match);
 LOADING=true;safeDraw();
 await Promise.all([loadFixture(),loadRoster()]);LOADING=false;
 if(!UI.match){const cur2=LS.get("fenixAnot3_cur_"+gender,null);if(cur2&&cur2.season===season&&cur2.match)loadMatch(cur2.match);}
 J.pas=J.pas||UI.lastPas||QBS[0]||null;safeDraw();}
async function boot(){
 LOADING=true;draw();await loadIndex();const ss=seasonsForGender();const saved=RAW.get("fenixTourn_"+gender,"");
 season=ss.includes(saved)?saved:(ss[0]||"");await loadSeason();}
window.addEventListener("pagehide",persist);
boot();
