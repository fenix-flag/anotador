<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E0F12">
<title>FENIX · Anotador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0E0F12;--panel:#16171B;--panel-2:#1C1D22;--line:#26282E;--line-2:#34363D;--ink:#F4F2EE;--muted:#9C9AA0;
    --gold:#F97316;--accent:#F97316;--on-accent:#1A0B02;--off:#F97316;--def:#A99CF5;--flag:#F87171;--turf:#4ADE80;
    --fd:'Barlow Condensed',sans-serif;--fb:'Barlow',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;padding-bottom:96px}
  .wrap{max-width:640px;margin:0 auto;padding:12px 12px 0}
  .gender{display:flex;gap:8px;margin-bottom:12px}
  .gender button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--fd);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
  .gender button.on{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
  header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  header img{width:40px;height:40px;object-fit:contain}
  header h1{font-family:var(--fd);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em}
  header h1 span{color:var(--gold)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  label.fld{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
  input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:16px;font-family:var(--fb)}
  input[inputmode=numeric]{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:20px;font-weight:800;font-family:var(--fd);width:110px;text-align:center}
  .score{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
  .score .box{text-align:center;flex:1}
  .score .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .score .p{font-family:var(--fd);font-size:40px;line-height:1}
  .score .box.fx .p{color:var(--gold)} .score .sep{font-family:var(--fd);font-size:26px;color:var(--muted)}
  .rvrow{display:flex;align-items:center;justify-content:center;gap:12px}
  .mini{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;width:34px;height:30px;font-weight:800;font-size:16px}
  .summary{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .sumsec{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .sumsec:last-child{margin-bottom:0}
  .sumlbl{font-family:var(--fd);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
  .sumlbl.o{color:var(--off)} .sumlbl.d{color:var(--def)}
  .schip{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted);font-weight:700}
  .schip b{color:var(--ink);font-family:var(--fd);font-size:15px;margin-left:4px}
  .downbar{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .downbar .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
  .downbar button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-family:var(--fd);font-size:17px}
  .downbar button.on{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
  .sidetoggle{display:flex;gap:8px;margin-bottom:12px}
  .sidetoggle button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--fd);font-size:20px;text-transform:uppercase}
  .sidetoggle button.on.off{background:var(--off);color:#06301d;border-color:var(--off)}
  .sidetoggle button.on.def{background:var(--def);color:#160c33;border-color:var(--def)}
  .types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .types button{padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-weight:700;font-size:15px}
  .types button.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .types.def button.on{border-color:var(--def);color:var(--def);box-shadow:0 0 0 1px var(--def) inset}
  .draft{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .slot{margin-bottom:12px}
  .pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .pbtn{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-family:var(--fd);font-size:18px}
  .pbtn.on{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
  .pgrid.def .pbtn.on{background:var(--def);color:#160c33;border-color:var(--def)}
  .pbtn.otro{border-style:dashed;color:var(--muted)}
  .pbtn.otro.on{background:var(--gold,#f5b942);color:#160c33;border-color:var(--gold,#f5b942);font-weight:800}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .toggle{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-weight:800}
  .toggle.on{background:var(--flag);color:#3a0011;border-color:var(--flag)}
  .toggle.on.g{background:var(--off);color:#06301d;border-color:var(--off)}
  .step{display:flex;align-items:center;gap:10px}
  .step b{font-family:var(--fd);font-size:24px;min-width:28px;text-align:center}
  .add{width:100%;margin-top:6px;padding:16px;border-radius:12px;border:none;background:var(--gold);color:#3a2a00;font-family:var(--fd);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
  .add:disabled{opacity:.4}
  .evlist,.errlist{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .evchip{background:rgba(142,123,255,.16);color:var(--def);border:1px solid rgba(142,123,255,.4);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
  .list{margin-top:4px}
  .play{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
  .play .badge{font-family:var(--fd);font-size:12px;padding:3px 7px;border-radius:6px;flex:none}
  .play .badge.off{background:rgba(55,209,139,.15);color:var(--off)}
  .play .badge.def{background:rgba(142,123,255,.15);color:var(--def)}
  .play .badge.riv{background:rgba(255,91,123,.15);color:var(--flag)}
  .dbadge{font-family:var(--fd);font-size:12px;color:var(--gold);border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:none}
  .play .txt{flex:1;font-size:14px}
  .play .txt small{color:var(--muted)}
  .play .x{background:transparent;border:none;color:var(--muted);font-size:20px;padding:4px 6px}
  .empty{color:var(--muted);text-align:center;padding:20px 10px;font-size:14px}
  .barbot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(14,17,36,.6),var(--bg));border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;max-width:640px;margin:0 auto}
  .barbot button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-weight:700;font-size:13px}
  .barbot button.prim{background:var(--off);color:#06301d;border-color:var(--off)}
  .barbot button.undo{background:var(--flag);color:#3a0011;border-color:var(--flag)}
  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:92vw;width:520px;padding:16px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  textarea{width:100%;height:150px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:monospace;font-size:12px;padding:10px}
  .dlgbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .dlgbtns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-weight:700}
  .dlgbtns button.prim{background:var(--gold);color:#3a2a00;border:none}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}

  /* ===== Estadio ===== */
  body{font-family:var(--fb);-webkit-font-smoothing:antialiased}
  button{font-family:var(--fb);cursor:pointer;touch-action:manipulation}
  button:active{transform:translateY(1px)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{padding:14px 14px 0}
  header{margin:6px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  header img{width:36px;height:36px}
  header h1{font-weight:800;font-size:26px;letter-spacing:.01em;line-height:1}
  header h1 span{color:var(--accent);margin-right:4px}
  /* genero: tabs con subrayado */
  .gender{gap:0;border-bottom:1px solid var(--line);margin-bottom:12px}
  .gender button{border:0;border-radius:0;background:transparent;padding:12px 8px 10px;font-weight:700;font-size:17px;letter-spacing:.06em;border-bottom:3px solid transparent;margin-bottom:-1px}
  .gender button.on{background:transparent;color:var(--ink);border-color:var(--accent)}
  #tournSel{border-radius:4px!important;font-family:var(--fb)!important;min-height:44px}
  .card{border-radius:4px;padding:14px;position:relative}
  label.fld{font-size:11px;letter-spacing:.14em;font-weight:700}
  input[type=text],input[type=number]{border-radius:4px!important;min-height:46px}
  input[type=text]:focus,input[type=number]:focus,#tournSel:focus{border-color:var(--accent)!important;outline:none}
  input[inputmode=numeric]{border-radius:4px;font-family:var(--fm)!important;font-weight:700}
  #pickBtn{border-radius:4px!important;min-height:46px;font-family:var(--fd)!important;font-size:17px!important;text-transform:uppercase;letter-spacing:.06em;border-color:var(--line-2)!important}
  #suggestBtn{border-radius:4px!important;min-height:46px;font-family:var(--fd)!important;font-size:15px!important;text-transform:uppercase;letter-spacing:.05em}
  #partidoLabel{letter-spacing:.03em!important}
  /* marcador */
  .score{gap:10px;margin-top:14px;padding:14px 4px 4px;border-top:1px solid var(--line)}
  .score .t{font-size:11px;letter-spacing:.14em;margin-bottom:6px}
  .score .box.fx .t{color:var(--accent)}
  .score .p{font-family:var(--fm);font-weight:700;font-size:42px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
  .score .box.fx .p{color:var(--ink)}
  .score .sep{font-family:var(--fm);font-size:22px}
  .rvrow{gap:8px}
  .mini{border-radius:4px;width:40px;height:40px;font-size:20px;line-height:1;color:var(--muted)}
  .mini:active{border-color:var(--accent);color:var(--ink)}
  .sumlbl{font-weight:800;font-size:14px;letter-spacing:.08em}
  .schip{border-radius:4px;font-weight:600}
  .schip b{font-family:var(--fm);font-size:13px;font-weight:700}
  /* downs */
  .downbar .lbl{letter-spacing:.14em}
  .downbar button{border-radius:4px;min-width:46px;min-height:42px;font-family:var(--fm);font-weight:700;font-size:15px;padding:8px 12px}
  .downbar button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  /* ataque / defensa */
  .sidetoggle{gap:0;border:1px solid var(--line);border-radius:4px;padding:3px;background:var(--panel)}
  .sidetoggle button{border:0;border-radius:3px;background:transparent;font-weight:800;font-size:19px;letter-spacing:.08em;padding:12px}
  .sidetoggle button.on.off{background:var(--accent);color:var(--on-accent)}
  .sidetoggle button.on.def{background:var(--def);color:#15112B}
  .types button{border-radius:4px;min-height:52px;font-weight:600;text-align:left;padding:14px 12px;border-left:3px solid var(--line)}
  .types button.on{border-color:var(--line);border-left-color:var(--accent);color:var(--ink);box-shadow:none;background:#231A12}
  .types.def button.on{border-color:var(--line);border-left-color:var(--def);color:var(--ink);box-shadow:none;background:#1D1B2A}
  .draft{border-top:1px solid var(--line)}
  .pgrid{gap:6px}
  .pbtn{border-radius:4px;min-height:48px;font-family:var(--fm);font-weight:700;font-size:17px}
  .pbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .pgrid.def .pbtn.on{background:var(--def);color:#15112B;border-color:var(--def)}
  .pbtn.otro{font-family:var(--fd);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
  .pbtn.otro.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .toggle{border-radius:4px;min-height:46px;font-weight:700;letter-spacing:.02em}
  .toggle.on{background:var(--flag);color:#2A0606;border-color:var(--flag)}
  .toggle.on.g{background:var(--turf);color:#062312;border-color:var(--turf)}
  .step b{font-family:var(--fm);font-weight:700;font-size:22px}
  .step .mini{width:44px;height:44px}
  .add{border-radius:4px;color:var(--on-accent);font-weight:800;font-size:20px;letter-spacing:.08em;min-height:56px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
  .add:disabled{opacity:1;background:var(--panel-2);color:var(--muted)}
  .evchip{background:#1D1B2A;border:1px solid #3B3566;border-radius:4px;font-weight:700}
  /* lista de jugadas */
  .play{border-radius:4px;padding:10px 10px 10px 12px;border-left:3px solid var(--line)}
  .play:has(.badge.off){border-left-color:var(--accent)}
  .play:has(.badge.def){border-left-color:var(--def)}
  .play:has(.badge.riv){border-left-color:var(--flag)}
  .play .badge{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;padding:3px 6px}
  .play .badge.off{background:rgba(249,115,22,.14);color:var(--accent)}
  .play .badge.def{background:rgba(169,156,245,.14);color:var(--def)}
  .play .badge.riv{background:rgba(248,113,113,.14);color:var(--flag)}
  .dbadge{font-family:var(--fm);font-weight:700;color:var(--muted);border-radius:3px}
  .play .x{min-width:40px;min-height:40px;border-radius:4px;font-size:18px}
  .play .x:active{background:var(--panel-2);color:var(--ink)}
  .empty{border:1px dashed var(--line);border-radius:4px}
  /* barra inferior */
  .barbot{background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .barbot button{border-radius:4px;min-height:48px;font-family:var(--fd);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.06em}
  .barbot button.prim{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .barbot button.undo{background:transparent;color:var(--flag);border-color:rgba(248,113,113,.5)}
  /* dialogos */
  dialog{border-radius:4px;padding:18px;border-color:var(--line-2);border-top:3px solid var(--accent)}
  dialog::backdrop{background:rgba(5,5,7,.72)}
  dialog h3{font-family:var(--fd);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
  dialog button[onclick^="pickPartido"]{border-radius:4px!important;min-height:48px}
  dialog button[onclick^="pickPartido"]:active{border-color:var(--accent)!important}
  textarea{border-radius:4px;font-family:var(--fm)}
  .dlgbtns button{border-radius:4px;min-height:46px;font-weight:700}
  .dlgbtns button.prim,dialog button.prim{background:var(--accent);color:var(--on-accent);border:none;border-radius:4px;min-height:46px;font-weight:700}
  .hint{line-height:1.45}
  .hint b{color:var(--ink)}
  .intdet{margin:10px 0 4px;padding:12px;border:1px solid var(--line);border-left:3px solid var(--def);border-radius:4px;background:var(--bg)}
  .intdet-t{font-family:var(--fd);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--def);margin-bottom:8px}
  .intdet .row{gap:16px}.intdet .slot{margin-bottom:8px}
  .penline{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
  .penline span{font-family:var(--fd);font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-size:14px}
  .penline b{font-family:var(--fm);font-size:20px}
  .penline small{color:var(--muted);font-size:11px}
  .downbar button[data-d="PEN"]{font-family:var(--fd);text-transform:uppercase;letter-spacing:.05em}
  .wrap{display:flex;flex-direction:column}
  .wrap>header{order:-1}
  .score .sep{align-self:flex-end;padding-bottom:8px}
  .barbot{gap:6px}
  .barbot button{min-width:0;padding:12px 2px;font-size:15px;letter-spacing:.03em}
</style>
</head>
<body>
<div class="wrap">

const ROSTER_M=[{n:2,name:"Thaiel Carballido"},{n:3,name:"Fernando Femia"},{n:5,name:"Federico Zuppinger"},{n:6,name:"Tomas Castillo"},{n:7,name:"Nicolás Fernandez"},{n:8,name:"Javier Cordero"},{n:9,name:"Agustín Moreno"},{n:10,name:"Martín Zuppinger"},{n:12,name:"Nahuel Pontoreiro"},{n:13,name:"Matías Di Sire"},{n:14,name:"Walter Zuppinger"},{n:19,name:"Alejandro Florez"},{n:21,name:"Thiago Paretti"},{n:24,name:"Facundo Zone"},{n:30,name:"Esequiel Di Sire"},{n:88,name:"Daniel Rolón"}];
const ROSTER_F=[{n:1,name:"María Mendieta"},{n:4,name:"Clarisa Ferreyra"},{n:7,name:"Magalí Gonzalez"},{n:8,name:"Abril Burgos"},{n:10,name:"Yesica Di Sire"},{n:11,name:"Aldana Di Sire"},{n:12,name:"Marisa Álvarez"},{n:17,name:"Melina Villasanti"},{n:22,name:"Mariela Yahari"},{n:23,name:"María Díaz"},{n:27,name:"Oriana Salazar"}];
const ROSTERS={m:ROSTER_M.slice(),f:ROSTER_F.slice()};

/* Ofensiva: tipos con formulario. Defensiva: constructor de eventos (abajo). */
const OFF_TYPES=[
  {id:"pase",label:"Pase completo",slots:[["pasador","Pasador"],["receptor","Receptor"]],yards:1,td:1,count:1},
  {id:"inc",label:"Incompleto",slots:[["pasador","Pasador"]]},
  {id:"drop",label:"Drop",slots:[["pasador","Pasador"],["receptor","Receptor"]]},
  {id:"corrida",label:"Corrida",slots:[["corredor","Corredor"]],yards:1,td:1,count:1},
  {id:"amague",label:"Amague",slots:[["amaguePlayer","Jugador"]],count:1},
  {id:"pe",label:"Punto extra"},
  {id:"falta",label:"Falta",slots:[["faltaPlayer","Jugador"]],falta:1},
  {id:"otro",label:"Otro / Sack",slots:[["player","Jugador"]]},
];
const EVS=[["flagb","Flag OK"],["flagm","Flag errado"],["defl","Deflección"],["int","Intercepción"],["pick6","Pick 6"],["sack","Sack"],["safety","Safety"],["falta","Falta"]];
const EVLBL=Object.fromEntries(EVS);
const evLbl=e=>(e.ev==="pick6"&&e.p2)?"Pick 2":EVLBL[e.ev];
const isPen=p=>p&&p.down==="PEN";

const $=s=>document.querySelector(s);
const uid=()=>Date.now()+"_"+Math.random().toString(36).slice(2,6);

let gender=(function(){try{return localStorage.getItem("fenixGender")||"m"}catch(e){return "m"}})();
let ROSTER=ROSTERS[gender];
let ST=loadST();
let side="off", draft=null, defDraft={events:[],ev:"flagb",editId:null}, lastPasador=null;

function stKey(){return "fenixAnot_"+gender;}
function loadST(){try{const s=JSON.parse(localStorage.getItem(stKey()));if(s){if(s.down===undefined)s.down="";return s;}}catch(e){}return {partido:"",rivalPts:0,plays:[],down:"",fxManual:null};}
function save(){try{localStorage.setItem(stKey(),JSON.stringify(ST))}catch(e){}}

/* ---------- género ---------- */
function renderGender(){
  $("#gender").innerHTML=[["m","Masculino"],["f","Femenino"]].map(([g,l])=>`<button data-g="${g}" class="${gender===g?'on':''}">${l}</button>`).join("");
  $("#gender").querySelectorAll("button").forEach(b=>b.onclick=()=>switchGender(b.dataset.g));
}
function switchGender(g){
  if(g===gender)return;
  save(); gender=g; try{localStorage.setItem("fenixGender",g)}catch(e){}
  ROSTER=ROSTERS[gender]; ST=loadST();
  draft=null; defDraft={events:[],ev:"flagb",editId:null}; side="off";
  renderAll(); buildTournamentUI(); syncRoster(); loadFixGames().then(updatePartidoLabel);
}

/* ---------- lado ---------- */
function setSideButtons(){$("#bOff").className="off"+(side==="off"?" on":"");$("#bDef").className="def"+(side==="def"?" on":"");}
function setSide(s){side=s;draft=null;defDraft={events:[],ev:"flagb",editId:null};setSideButtons();renderArea();}
function renderArea(){
  const types=$("#types"),box=$("#draft");
  types.className="types"+(side==="def"?" def":"");
  if(!ROSTER.length){types.innerHTML="";box.style.display="block";box.innerHTML='<div class="empty">No hay plantel '+(gender==="f"?"femenino":"masculino")+' cargado.</div>';return;}
  if(side==="off"){renderTypes();box.style.display=draft?"block":"none";if(draft)renderDraft();}
  else{renderDefBuilder();}
}
function renderTypes(){
  $("#types").innerHTML=OFF_TYPES.map(t=>`<button data-id="${t.id}" class="${draft&&draft.type===t.id?'on':''}">${t.label}</button>`).join("");
  $("#types").querySelectorAll("button").forEach(b=>b.onclick=()=>startDraft(b.dataset.id));
}
const offCfg=id=>OFF_TYPES.find(t=>t.id===id);

/* ---------- down ---------- */
function renderDown(){
  const opts=[["","—"],["1","1°"],["2","2°"],["3","3°"],["4","4°"],["PE","PE"],["PEN","PEN"]];
  $("#downbar").innerHTML=`<span class="lbl">Down</span>`+opts.map(([v,l])=>`<button data-d="${v}" class="${ST.down===v?'on':''}">${l}</button>`).join("");
  $("#downbar").querySelectorAll("button").forEach(b=>b.onclick=()=>{ST.down=b.dataset.d;save();renderDown();renderPen();if(side==="def")renderDefBuilder();});
}

/* ---------- ofensiva: formulario ---------- */
function startDraft(typeId,edit){
  const t=offCfg(typeId);
  draft=edit||{side:"off",type:typeId,vals:{}};
  if(!edit&&typeId==="pase"&&lastPasador!=null&&draft.vals.pasador==null)draft.vals.pasador=lastPasador;
  if(!edit&&t.pepts&&draft.vals.pePoints==null)draft.vals.pePoints=1;
  if(!edit&&t.count&&draft.vals.count==null)draft.vals.count=(typeId==="amague"?1:0);
  if(!edit&&t.falta&&draft.vals.faltaTipo==null)draft.vals.faltaTipo="hecha";
  if(!edit&&typeId==="pe"){if(!draft.vals.peKind)draft.vals.peKind="pase";if(draft.vals.pePoints==null)draft.vals.pePoints=1;if(ST.down!=="PEN")ST.down="PE";save();}
  renderTypes();$("#draft").style.display="block";renderDraft();renderDown();
}
function renderDraft(){
  const box=$("#draft");if(!draft){box.style.display="none";return;}
  const t=offCfg(draft.type),v=draft.vals;
  if(draft.type==="otro"){renderOtroDraft(box,v);return;}
  if(draft.type==="pe"){renderPeDraft(box,v);return;}
  let h="";
  t.slots.forEach(([key,lbl])=>{h+=`<div class="slot"><label class="fld">${lbl}</label><div class="pgrid" data-slot="${key}">`+rosterBtns(v[key])+`</div></div>`;});
  if(t.yards)h+=`<div class="slot"><label class="fld">Yardas</label><div class="step"><button class="mini" data-yd="-1">–</button><input inputmode="numeric" id="yards" value="${v.yards??0}" style="width:80px;font-size:18px"><button class="mini" data-yd="1">+</button></div></div>`;
  const chips=[];
  if(t.td)chips.push(`<button class="toggle g ${v.td?'on':''}" data-flag="td">TD</button>`);
  if(t.pepts)chips.push(`<div class="slot"><label class="fld">Puntos</label><button class="toggle ${v.pePoints===0?'on':''}" data-pts="0">Falló</button> <button class="toggle ${v.pePoints==1?'on g':''}" data-pts="1">1</button> <button class="toggle ${v.pePoints==2?'on g':''}" data-pts="2">2</button></div>`);

  if(t.count)chips.push(`<div class="slot"><label class="fld">Amagues</label><div class="step"><button class="mini" data-c="-1">–</button><b>${v.count??0}</b><button class="mini" data-c="1">+</button></div></div>`);
  if(chips.length)h+=`<div class="row">${chips.join("")}</div>`;

  const y=$("#yards");if(y)y.oninput=()=>{v.yards=y.value===""?0:+y.value;};
  box.querySelectorAll("[data-yd]").forEach(b=>b.onclick=()=>{v.yards=Math.max(0,(+v.yards||0)+(+b.dataset.yd));renderDraft();});
  box.querySelectorAll("[data-flag]").forEach(b=>b.onclick=()=>{v[b.dataset.flag]=!v[b.dataset.flag];renderDraft();});
  box.querySelectorAll("[data-pts]").forEach(b=>b.onclick=()=>{v.pePoints=+b.dataset.pts;renderDraft();});
  box.querySelectorAll("[data-falta]").forEach(b=>b.onclick=()=>{v.faltaTipo=(b.dataset.falta==="h")?"hecha":"recibida";renderDraft();});
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{v.count=Math.max(0,(v.count??0)+(+b.dataset.c));renderDraft();});
  const add=$("#addBtn");if(add)add.onclick=commitDraft;
}
function askOtroDlg(cb){
  openDlg(`<h3 style="margin:0 0 8px">Jugador/a no registrado</h3><p class="hint">Poné un número para identificarlo (ej: 99).</p><input type="number" id="otroInput" inputmode="numeric" placeholder="99" style="width:100%;font-size:22px;padding:11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);text-align:center;box-sizing:border-box"><div id="otroErr" class="hint" style="color:var(--flag);display:none">Poné solo un número.</div><div class="dlgbtns"><button onclick="closeDlg()">Cancelar</button><button class="prim" id="otroOk">Usar</button></div>`);
  setTimeout(()=>{const i=$("#otroInput");if(i)i.focus();},60);
  const go=()=>{const raw=($("#otroInput").value||"").trim();const n=parseInt(raw.replace("#",""),10);if(raw===""||isNaN(n)){$("#otroErr").style.display="block";return;}closeDlg();cb(n);};
  $("#otroOk").onclick=go;
  $("#otroInput").onkeydown=e=>{if(e.key==="Enter")go();};
}
function rosterBtns(cur){const inR=ROSTER.some(p=>p.n==cur);const off=(cur!=null&&!inR);return ROSTER.map(p=>`<button class="pbtn ${cur==p.n?'on':''}" data-num="${p.n}">${p.n}</button>`).join("")+`<button class="pbtn otro ${off?'on':''}" data-otro>${off?('#'+cur):'Otro'}</button>`;}
function slotGrid(key,lbl,v){return `<div class="slot"><label class="fld">${lbl}</label><div class="pgrid" data-slot="${key}">`+rosterBtns(v[key])+`</div></div>`;}
function renderPeDraft(box,v){
  if(!v.peKind)v.peKind="pase"; if(v.pePoints===undefined)v.pePoints=1;
  let h=`<div class="slot"><label class="fld">Tipo de conversión</label><div class="row"><button class="toggle ${v.peKind==='pase'?'on g':''}" data-pk="pase">Pase</button> <button class="toggle ${v.peKind==='corrida'?'on g':''}" data-pk="corrida">Corrida</button></div></div>`;
  const fallo=v.pePoints===0;

  h+=`<div class="slot"><label class="fld">Resultado</label><div class="row"><button class="toggle ${v.pePoints===0?'on':''}" data-pp="0">Falló</button> <button class="toggle ${v.pePoints===1?'on g':''}" data-pp="1">x1</button> <button class="toggle ${v.pePoints===2?'on g':''}" data-pp="2">x2</button></div></div>`;
  h+=`<div class="slot"><label class="fld">Amagues</label><div class="step"><button class="mini" data-c="-1">–</button><b>${v.count??0}</b><button class="mini" data-c="1">+</button></div></div>`;
  const ready=v.peKind==='corrida'?v.corredor!=null:(fallo?(v.pasador!=null||v.receptor!=null):v.receptor!=null);
  h+=`<button class="add" id="addBtn" ${ready?'':'disabled'}>${draft.editId?'Guardar cambios':'Agregar jugada'}</button>`;

function advanceDown(){const m={"1":"2","2":"3","3":"4","4":"1","PE":"1"};if(ST.down in m){ST.down=m[ST.down];save();renderDown();}}
function renderOtroDraft(box,v){
  let h=`<div class="slot"><label class="fld">Situación</label><div class="row">
    <button class="toggle ${v.sack?'on':''}" data-o="sack">Sack al QB</button>
    <button class="toggle ${v.intc?'on':''}" data-o="intc">Intercepción</button></div></div>`;
  h+=`<div class="slot"><label class="fld">${v.intc?"QB que lanzó":(v.sack?"QB":"Jugador")} (opcional)</label><div class="pgrid" data-slot="player">`+rosterBtns(v.player)+`</div></div>`;
  h+=`<div class="slot"><label class="fld">Nota (opcional)</label><input type="text" id="otroNote" value="${(v.note||'').replace(/"/g,'&quot;')}" placeholder="qué pasó..."></div>`;
  const ready=v.sack||v.intc||v.player!=null||(v.note&&v.note.trim());
  h+=`<button class="add" id="addBtn" ${ready?'':'disabled'}>${draft.editId?'Guardar cambios':'Agregar jugada'}</button>`;
  box.innerHTML=h;
  box.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{v[b.dataset.o]=!v[b.dataset.o];renderDraft();});
  box.querySelectorAll('[data-slot="player"] .pbtn').forEach(b=>b.onclick=()=>{if(b.hasAttribute("data-otro")){askOtroDlg(n=>{v.player=n;renderDraft();});return;}const n=+b.dataset.num;v.player=(v.player==n)?null:n;renderDraft();});
  const nt=$("#otroNote");if(nt)nt.oninput=()=>{v.note=nt.value;const a=$("#addBtn");if(a)a.disabled=!(v.sack||v.intc||v.player!=null||(v.note&&v.note.trim()));};
  const add=$("#addBtn");if(add)add.onclick=commitDraft;

function commitDraft(){
  const t=offCfg(draft.type),v=draft.vals;
  if(draft.type==="otro"){ if(!(v.sack||v.intc||v.player!=null||(v.note&&v.note.trim())))return; }
  else if(draft.type==="pe"){const ok=v.peKind==="corrida"?v.corredor!=null:(v.pePoints===0?(v.pasador!=null||v.receptor!=null):v.receptor!=null);if(!ok)return;}
  else if(t.slots[0]&&v[t.slots[0][0]]==null)return;
  if(draft.type==="pase"||draft.type==="corrida"){if(v.yards==null)v.yards=0;}
  if(draft.type==="pase")lastPasador=v.pasador;
  if(draft.editId){const i=ST.plays.findIndex(p=>p.id===draft.editId);if(i>=0)ST.plays[i]={id:draft.editId,side:"off",type:draft.type,vals:{...v},down:ST.down};}
  else ST.plays.push({id:uid(),side:"off",type:draft.type,vals:{...v},down:ST.down});
  save();
  const keep=(draft.type==="pase")?{pasador:v.pasador}:(draft.type==="pe"?{peKind:v.peKind,pePoints:1}:{});
  draft={side:"off",type:draft.type,vals:keep};
  if(t.count)draft.vals.count=(draft.type==="amague"?1:0);if(t.falta)draft.vals.faltaTipo="hecha";
  advanceDown();
  renderDraft();renderList();renderScore();renderSummary();
}

/* ---------- defensiva: constructor de eventos múltiples ---------- */
function renderDefBuilder(){
  $("#types").innerHTML=EVS.map(([id,l])=>`<button data-ev="${id}" class="${defDraft.ev===id?'on':''}">${l}</button>`).join("");
  $("#types").querySelectorAll("button").forEach(b=>b.onclick=()=>{defDraft.ev=b.dataset.ev;renderDefBuilder();});

  if(defDraft.ev==="falta")h+=`<div class="slot"><label class="fld">Tipo de falta</label><div class="row"><button class="toggle ${defDraft.faltaTipo!=="recibida"?"on":""}" data-ft="hecha">Hecha</button> <button class="toggle ${defDraft.faltaTipo==="recibida"?"on":""}" data-ft="recibida">Recibida</button></div></div>`;
  h+=`<div class="slot"><label class="fld">Tocá el jugador del evento: <b style="color:var(--def)">${EVLBL[defDraft.ev]}${defDraft.ev==="falta"?(" "+(defDraft.faltaTipo==="recibida"?"recibida":"hecha")):""}</b></label><div class="pgrid def" id="defGrid">`+ROSTER.map(p=>`<button class="pbtn ${defDraft.events.some(e=>e.n===p.n)?'on':''}" data-num="${p.n}">${p.n}</button>`).join("")+`<button class="pbtn otro" data-otro>Otro</button></div></div>`;
  if(defDraft.events.length)h+=`<div class="evlist">`+defDraft.events.map((e,i)=>`<span class="evchip" data-i="${i}">${evLbl(e)}${e.ev==="falta"?(e.tipo==="recibida"?" rec":" hech"):""} ${e.n} ✕</span>`).join("")+`</div>`;

    h+=`<div class="intdet"><div class="intdet-t">${evLbl(e)} de #${e.n}</div>`;
    if(e.ev==="pick6")h+=`<div class="slot"><label class="fld">Retorno</label><div class="row"><button class="toggle ${!e.p2?'on g':''}" data-p2="${i}:0">Pick 6 · TD (+6)</button> <button class="toggle ${e.p2?'on g':''}" data-p2="${i}:1">Pick 2 · en PE (+2)</button></div></div>`;
    h+=`<div class="row"><div class="slot"><label class="fld">Yardas de retorno</label><div class="step"><button class="mini" data-iyd="${i}:-1">–</button><input inputmode="numeric" class="iyd" data-i="${i}" value="${e.yd??0}" style="width:80px;font-size:18px"><button class="mini" data-iyd="${i}:1">+</button></div></div>
      <div class="slot"><label class="fld">Amagues</label><div class="step"><button class="mini" data-iam="${i}:-1">–</button><b>${e.am??0}</b><button class="mini" data-iam="${i}:1">+</button></div></div></div></div>`;});
  h+=`<div class="hint">Sumá todos los eventos de la misma jugada (ej: Deflección 8 → Intercepción 13) y después "Agregar jugada".</div>`;
  h+=`<button class="add" id="addBtn" ${defDraft.events.length?'':'disabled'}>${defDraft.editId?'Guardar cambios':'Agregar jugada'}</button>`;
  h+=`<div class="slot" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:12px"><label class="fld">TD del rival (nos anotaron)</label><div class="row">
    <button class="toggle" data-tdr="0">TD · falló (6)</button>
    <button class="toggle" data-tdr="1">TD · x1 (7)</button>
    <button class="toggle" data-tdr="2">TD · x2 (8)</button></div></div>`;
  if(ST.down==="PEN")h+=`<div class="slot"><label class="fld">Penal del rival (solo conversión)</label><div class="row">
    <button class="toggle" data-cvr="0">Falló</button>
    <button class="toggle" data-cvr="1">x1 (1)</button>

  box.innerHTML=h;
  box.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{defDraft.faltaTipo=b.dataset.ft;renderDefBuilder();});

  box.querySelectorAll("[data-p2]").forEach(b=>b.onclick=()=>{const [i,x]=b.dataset.p2.split(":");defDraft.events[+i].p2=x==="1";renderDefBuilder();});
  box.querySelectorAll("[data-iyd]").forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.iyd.split(":");const e=defDraft.events[+i];e.yd=(+e.yd||0)+(+d);renderDefBuilder();});
  box.querySelectorAll(".iyd").forEach(inp=>inp.oninput=()=>{const n=parseInt(inp.value.replace(/[^0-9-]/g,""),10);defDraft.events[+inp.dataset.i].yd=isNaN(n)?0:n;});
  box.querySelectorAll("[data-iam]").forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.iam.split(":");const e=defDraft.events[+i];e.am=Math.max(0,(+e.am||0)+(+d));renderDefBuilder();});
  box.querySelectorAll("[data-cvr]").forEach(b=>b.onclick=()=>{ST.plays.push({id:uid(),side:"def",type:"convrival",vals:{conv:+b.dataset.cvr},down:ST.down});save();renderList();renderScore();});
  box.querySelectorAll("#defGrid .pbtn").forEach(b=>b.onclick=()=>{if(b.hasAttribute("data-otro")){askOtroDlg(n=>{defDraft.events.push(mkEv(n));renderDefBuilder();});return;}defDraft.events.push(mkEv(+b.dataset.num));renderDefBuilder();});
  box.querySelectorAll(".evchip").forEach(c=>c.onclick=()=>{defDraft.events.splice(+c.dataset.i,1);renderDefBuilder();});
  box.querySelectorAll("[data-tdr]").forEach(b=>b.onclick=()=>{ST.plays.push({id:uid(),side:"def",type:"tdrival",vals:{conv:+b.dataset.tdr},down:ST.down});save();renderList();renderScore();});

function commitDef(){
  if(!defDraft.events.length)return;
  if(defDraft.editId){const i=ST.plays.findIndex(p=>p.id===defDraft.editId);if(i>=0)ST.plays[i]={id:defDraft.editId,side:"def",type:"multi",vals:{events:[...defDraft.events]},down:ST.down};}
  else ST.plays.push({id:uid(),side:"def",type:"multi",vals:{events:[...defDraft.events]},down:ST.down});
  save();defDraft={events:[],ev:defDraft.ev,editId:null};renderDefBuilder();renderList();renderScore();renderSummary();
}

/* ---------- lista ---------- */
function P(n){return `<b>${n}</b>`;}
function playText(p){const v=p.vals;switch(p.type){
  case"pase":return `Pase ${P(v.pasador)}→${P(v.receptor)} <small>+${v.yards||0}yd${v.td?' · TD':''}${v.count>0?' · '+v.count+' amag':''}</small>`;
  case"inc":return `Incompleto ${P(v.pasador)}`;
  case"drop":return `Drop ${P(v.receptor)} <small>(pase de ${v.pasador})</small>`;
  case"corrida":return `Corrida ${P(v.corredor)} <small>+${v.yards||0}yd${v.td?' · TD':''}${v.count>0?' · '+v.count+' amag':''}</small>`;
  case"amague":return `Amague ${P(v.amaguePlayer)} <small>x${v.count||1}</small>`;
  case"pe":{const res=v.pePoints===0?'falló':('x'+v.pePoints);const who=v.peKind==='corrida'?('corr '+(v.corredor??'?')):('pase '+(v.pasador??'?')+'→'+(v.receptor??'?'));return `PE ${who} <small>${res}</small>`;}
  case"falta":return `Falta ${v.faltaTipo==='recibida'?'recibida':'hecha'} ${P(v.faltaPlayer)}`;
  case"multi":return `<small>${(v.events||[]).map(e=>evLbl(e)+" "+e.n+((e.ev==="int"||e.ev==="pick6")&&(e.yd||e.am)?` (${e.yd||0}yd${e.am?', '+e.am+' am':''})`:'')).join(" · ")}</small>`;
  case"otro":{const tg=[];if(v.sack)tg.push('Sack');if(v.intc)tg.push('Intercep');const who=v.player!=null?' '+v.player:'';const nn=v.note?' — '+v.note:'';return `Otro${who} <small>${tg.join(', ')}${nn}</small>`;}
  case"convrival":{const c=v.conv||0;return `Conversión del rival <small>${c===0?'falló':'x'+c+' · '+c+' pts'}</small>`;}
  case"tdrival":{const c=v.conv||0;return `TD del rival <small>${c===0?'falló conv':'conv x'+c} · ${6+c} pts</small>`;}
  default:return p.type;
}}
function renderList(){
  const el=$("#list");
  if(!ST.plays.length){el.innerHTML='<div class="empty">Todavía no cargaste jugadas.</div>';return;}
  el.innerHTML=[...ST.plays].reverse().map(p=>{
    const badge=(p.type==="tdrival"||p.type==="convrival")?`<span class="badge riv">RIV</span>`:`<span class="badge ${p.side}">${p.side==='off'?'OF':'DEF'}</span>`;
    const editBtn=(p.type==="tdrival"||p.type==="convrival")?"":`<button class="x" data-edit="${p.id}">✎</button>`;
    return `<div class="play">${badge}${p.down?`<span class="dbadge">${p.down==='PE'?'PE':(p.down==='PEN'?'PEN':p.down+'°')}</span>`:''}
      <span class="txt">${playText(p)}</span>
      ${editBtn}<button class="x" data-del="${p.id}">✕</button></div>`;}).join("");
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ST.plays=ST.plays.filter(p=>p.id!==b.dataset.del);save();renderList();renderScore();renderSummary();});
  el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const p=ST.plays.find(x=>x.id===b.dataset.edit);if(!p)return;
    ST.down=p.down||"";renderDown();
    if(p.side==="def"){setSide("def");defDraft={events:(p.vals.events||[]).map(e=>({...e})),ev:"flagb",editId:p.id};renderDefBuilder();}
    else{setSide("off");startDraft(p.type,{editId:p.id,side:"off",type:p.type,vals:{...p.vals}});}
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

/* ---------- marcador y resumen ---------- */
function fenixPoints(){let pts=0;ST.plays.forEach(p=>{const v=p.vals;
  if((p.type==="pase"||p.type==="corrida")&&v.td)pts+=6;
  if(p.type==="pe")pts+=(+v.pePoints||0);
  if(p.type==="multi")(v.events||[]).forEach(e=>{if(e.ev==="pick6")pts+=(e.p2?2:6);if(e.ev==="safety")pts+=2;});
});return pts;}
function rivalPoints(){let p=+ST.rivalPts||0;ST.plays.forEach(pl=>{if(pl.type==="tdrival")p+=6+(pl.vals.conv||0);if(pl.type==="convrival")p+=(pl.vals.conv||0);});return p;}
function penScore(){let f=0,r=0,any=false;ST.plays.forEach(p=>{if(!isPen(p))return;any=true;const v=p.vals;
  if(p.type==="pe")f+=(+v.pePoints||0);
  if((p.type==="pase"||p.type==="corrida")&&v.td)f+=6;
  if(p.type==="multi")(v.events||[]).forEach(e=>{if(e.ev==="pick6")f+=(e.p2?2:6);if(e.ev==="safety")f+=2;});
  if(p.type==="convrival")r+=(v.conv||0);if(p.type==="tdrival")r+=6+(v.conv||0);});
  return any?{f,r}:null;}
function renderPen(){const el=$("#penLine");if(!el)return;const s=penScore();if(!s&&ST.down!=="PEN"){el.style.display="none";return;}const x=s||{f:0,r:0};el.style.display="";el.innerHTML=`<span>Penales</span><b>${x.f} – ${x.r}</b><small>incluidos en el marcador</small>`;}
function fenixScore(){return (ST.fxManual!=null)?ST.fxManual:fenixPoints();}
function renderScore(){renderPen();const el=$("#fxPts");el.textContent=fenixScore();el.style.color=(ST.fxManual!=null&&ST.fxManual!==fenixPoints())?"var(--accent)":"";$("#rvPts").textContent=rivalPoints();}
function calcStats(){let td=0,comp=0,inc=0,drops=0,peT=0,peC=0,flags=0,flagsM=0,intc=0,defl=0,sacks=0;
  ST.plays.forEach(p=>{const v=p.vals;
    if(p.type==="pase"){comp++;if(v.td)td++;}
    if(p.type==="inc"||(p.type==="otro"&&p.vals.intc))inc++;
    if(p.type==="drop")drops++;
    if(p.type==="corrida"&&v.td)td++;
    if(p.type==="pe"){peT++;if((v.pePoints===undefined?1:v.pePoints)>0)peC++;}
    if(p.type==="multi")(v.events||[]).forEach(e=>{if(e.ev==="int"||e.ev==="pick6")intc++;if(e.ev==="flagb")flags++;if(e.ev==="flagm")flagsM++;if(e.ev==="defl")defl++;if(e.ev==="sack")sacks++;});
  });
  const pasePct=(comp+inc+drops)?Math.round(comp/(comp+inc+drops)*100):null;
  const recPct=(comp+drops)?Math.round(comp/(comp+drops)*100):null;
  const flagPct=(flags+flagsM)?Math.round(flags/(flags+flagsM)*100):null;
  return {td,peT,peC,pasePct,recPct,flags,flagsM,flagPct,intc,defl,sacks};}
function renderSummary(){const s=calcStats();const pc=v=>v==null?"—":v+"%";
  const off=[["TD",s.td],["PE",`${s.peC}-${s.peT}`],["%Pase",pc(s.pasePct)],["%Rec",pc(s.recPct)]];
  const def=[["Flags",s.flags],["%Flags",pc(s.flagPct)],["Deflec",s.defl],["Intercep",s.intc]];
  $("#summary").innerHTML=
    `<div class="sumsec"><span class="sumlbl o">Ofensiva</span>`+off.map(([k,v])=>`<span class="schip">${k}<b>${v}</b></span>`).join("")+`</div>`+
    `<div class="sumsec"><span class="sumlbl d">Defensiva</span>`+def.map(([k,v])=>`<span class="schip">${k}<b>${v}</b></span>`).join("")+`</div>`;}

/* ---------- filas para la planilla ---------- */
const OFF_HDR=["Partido","jugada","centro","snap","pasador","yd de pase","pas inc","intercep","sack","receptor","yd ganadas recep","drop","corredor","yd corrida","amague jg","amagues","td jugador","asistencia td","pt ext","jugador p ext","asist p ext","falta jugador","falta recibida","penales"];
const DEF_HDR=["Partido","jugada","situacion","flag capturado","flag errado","pase desviado","intercepcion","amagues","pick 6","sacks","safety","faltas realizadas","faltas recibidas","yd intercep","pick 2","penales"];
function offDicts(p){const v=p.vals;const o={};OFF_HDR.forEach(k=>o[k]="");
  switch(p.type){
    case"pase":o["pasador"]=v.pasador;o["yd de pase"]=v.yards||0;o["receptor"]=v.receptor;o["yd ganadas recep"]=v.yards||0;if(v.td){o["td jugador"]=v.receptor;o["asistencia td"]=v.pasador;}if(v.count>0){o["amague jg"]=v.receptor;o["amagues"]=v.count;}break;
    case"inc":o["pas inc"]=v.pasador;break;
    case"drop":o["drop"]=v.receptor;o["pas inc"]=v.pasador;break;
    case"corrida":o["corredor"]=v.corredor;o["yd corrida"]=v.yards||0;if(v.td)o["td jugador"]=v.corredor;if(v.count>0){o["amague jg"]=v.corredor;o["amagues"]=v.count;}break;
    case"amague":o["amague jg"]=v.amaguePlayer;o["amagues"]=v.count||1;break;
    case"pe":{const pp=(v.pePoints===undefined?1:v.pePoints);o["pt ext"]=pp;if(pp>0){if(v.peKind==="corrida"){o["jugador p ext"]=v.corredor;}else{o["jugador p ext"]=v.receptor;if(v.pasador!=null)o["asist p ext"]=v.pasador;}}if(v.count>0){o["amague jg"]=(v.peKind==="corrida"?v.corredor:v.receptor);o["amagues"]=v.count;}break;}
    case"falta":if(v.faltaTipo==="recibida")o["falta recibida"]=v.faltaPlayer;else o["falta jugador"]=v.faltaPlayer;break;
    case"otro":{if(v.sack&&v.player!=null)o["sack"]=v.player;if(v.intc&&v.player!=null){o["intercep"]=v.player;o["pas inc"]=v.player;}const has=OFF_HDR.some(k=>k!=="Partido"&&k!=="jugada"&&o[k]!=="");if(!has)return [];break;}
  }return [o];}
function defDicts(p){const mk=()=>{const o={};DEF_HDR.forEach(k=>o[k]="");return o;};let out=[];
  (p.vals.events||[]).forEach(e=>{const o=mk();
    if(e.ev==="flagb")o["flag capturado"]=e.n;
    else if(e.ev==="flagm")o["flag errado"]=e.n;
    else if(e.ev==="defl")o["pase desviado"]=e.n;
    else if(e.ev==="int"||e.ev==="pick6"){o["intercepcion"]=e.n;if(e.am>0)o["amagues"]=e.am;o["yd intercep"]=e.yd||0;if(e.ev==="pick6")o[e.p2?"pick 2":"pick 6"]=e.n;}
    else if(e.ev==="sack")o["sacks"]=e.n;
    else if(e.ev==="safety")o["safety"]=e.n;
    else if(e.ev==="falta"){if(e.tipo==="recibida")o["faltas recibidas"]=e.n;else o["faltas realizadas"]=e.n;}
    out.push(o);});
  return out;}
function buildRows(){let off=[],def=[],io=0,id=0;
  ST.plays.forEach(p=>{
    const pen=isPen(p)?"si":"";
    if(p.side==="off")offDicts(p).forEach(o=>{o["penales"]=pen;o["Partido"]=ST.partido;o["jugada"]=++io;off.push(OFF_HDR.map(k=>o[k]));});
    else defDicts(p).forEach(o=>{o["penales"]=pen;o["Partido"]=ST.partido;o["jugada"]=++id;def.push(DEF_HDR.map(k=>o[k]));});
  });return {off,def};}
const tsv=rows=>rows.map(r=>r.join("\t")).join("\n");
const csvOf=(hdr,rows)=>[hdr.join(",")].concat(rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(","))).join("\n");

/* ---------- barra inferior ---------- */
$("#btnUndo").onclick=()=>{if(!ST.plays.length)return;ST.plays.pop();save();renderList();renderScore();renderSummary();};
$("#btnExport").onclick=()=>{
  if(!ST.partido){alert("Poné primero el nombre del partido.");return;}
  const {off,def}=buildRows();
  openDlg(`<h3 style="margin:0 0 8px">Exportar · ${ST.partido}</h3>
    <p class="hint">Pegá en las pestañas <b>Off</b> (${off.length}) y <b>Def</b> (${def.length}) de tu planilla, debajo de lo que ya haya. O bajá el CSV.</p>
    <label class="fld">Filas OFF</label><textarea id="taOff" readonly>${tsv(off)}</textarea>
    <label class="fld" style="margin-top:8px">Filas DEF</label><textarea id="taDef" readonly>${tsv(def)}</textarea>
    <div class="dlgbtns">
      <button onclick="copyTa('taOff')">Copiar Off</button><button onclick="copyTa('taDef')">Copiar Def</button>
      <button onclick="dl('Off',OFF_HDR,buildRows().off)">CSV Off</button><button onclick="dl('Def',DEF_HDR,buildRows().def)">CSV Def</button>
      <button class="prim" onclick="closeDlg()">Cerrar</button></div>`);
};
window.copyTa=id=>{const t=$("#"+id);t.select();try{navigator.clipboard.writeText(t.value);}catch(e){}t.blur();};
window.dl=(name,hdr,rows)=>{const b=new Blob([csvOf(hdr,rows)],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${ST.partido}-${name}.csv`;a.click();};
function rivalNameOf(){const lb=partidoLabel(ST.partido);return (lb&&lb.includes("vs "))?lb.split("vs ").pop().trim():"Rival";}
/* URL de subida: la del Panel (misma web) si está configurada; si no, la de CONFIG. */
function uploadUrl(){try{const c=JSON.parse(localStorage.getItem("fenixPanel.cfg")||"{}");if(c.apiUrl&&/\/exec$/.test(c.apiUrl.trim()))return c.apiUrl.trim();}catch(e){}return CONFIG.UPLOAD_URL;}
function destinoTxt(){return `${gender==="f"?"Femenino":"Masculino"} · ${season||"(sin torneo elegido)"}`;}
async function doUpload(off,def,fxScore,rvScore){
  const url=uploadUrl(), sid=sheetIdFor();
  openDlg(`<h3 style="margin:0 0 8px">Subiendo…</h3><p class="hint">${destinoTxt()}</p>`);
  const fail=msg=>openDlg(`<h3 style="margin:0 0 8px">No se subió</h3><p class="hint">${msg}</p><p class="hint">Las jugadas siguen guardadas en este celular. No toques Vaciar.</p><p class="hint" style="word-break:break-all">Destino: ${destinoTxt()}<br>API: ${url}</p><div class="dlgbtns"><button class="prim" onclick="closeDlg()">Ok</button></div>`);
  let res,txt;
  try{res=await fetch(url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({kind:"plays",gender:gender,sheetId:sid,partido:ST.partido,offHdr:OFF_HDR,defHdr:DEF_HDR,offRows:off,defRows:def,fenixScore:fxScore,rivalScore:rvScore})});txt=await res.text();}
  catch(e){return fail("No hubo respuesta del Apps Script ("+e.message+"). Revisá la señal o que la implementación siga activa.");}
  let j=null;try{j=JSON.parse(txt);}catch(e){}
  if(!j)return fail("El Apps Script respondió algo que no es la API (¿URL vieja o permisos de la implementación en \"Cualquier persona\"?).");
  if(!j.ok)return fail("El Apps Script dio error: <b>"+(j.error||"desconocido")+"</b>");
  const sc=j.score==="ok"?"Marcador guardado en el Fixture.":("Marcador no guardado: "+(j.score||"—")+".");
  openDlg(`<h3 style="margin:0 0 8px">✓ Subido</h3><p class="hint"><b>${j.off}</b> filas de ataque y <b>${j.def}</b> de defensa en <b>${destinoTxt()}</b>, partido "${ST.partido}".<br>${sc}<br>Fenix ${fxScore} - ${rvScore} ${rivalNameOf()}</p><div class="dlgbtns"><button class="prim" onclick="closeDlg()">Listo</button></div>`);
}
$("#btnUpload").onclick=()=>{
  if(!ST.partido){openDlg(`<h3 style="margin:0 0 8px">Falta el partido</h3><p class="hint">Elegí o escribí el partido primero.</p><div class="dlgbtns"><button class="prim" onclick="closeDlg()">Ok</button></div>`);return;}
  if(!uploadUrl()){openDlg(`<h3 style="margin:0 0 8px">Subir a la planilla</h3><p class="hint">Falta configurar la URL del Apps Script en <b>CONFIG.UPLOAD_URL</b>.</p><div class="dlgbtns"><button class="prim" onclick="closeDlg()">Ok</button></div>`);return;}
  const {off,def}=buildRows();
  const fxCalc=fenixPoints(), rival=rivalPoints(), manual=ST.fxManual, rn=rivalNameOf();
  const btn=(lbl,fx)=>`<button class="prim" style="display:block;width:100%;margin-bottom:8px" onclick="window._up(${fx})">${lbl}: Fenix ${fx} - ${rival} ${rn}</button>`;
  window._up=(fx)=>{closeDlg();doUpload(off,def,fx,rival);};
  if(manual!=null && manual!==fxCalc){
    openDlg(`<h3 style="margin:0 0 8px">¿Qué marcador guardo?</h3><p class="hint">El marcador a mano no coincide con el calculado de las jugadas. Elegí cuál va al Fixture:</p>${btn("A mano",manual)}${btn("Calculado (stats)",fxCalc)}<div class="dlgbtns"><button onclick="closeDlg()">Cancelar</button></div>`);
  } else {
    const fx=(manual!=null?manual:fxCalc);
    openDlg(`<h3 style="margin:0 0 8px">Subir a la planilla</h3><p class="hint">Destino: <b>${destinoTxt()}</b><br>${off.length} jugadas de ataque y ${def.length} de defensa.<br>Marcador: <b>Fenix ${fx} - ${rival} ${rn}</b>.<br>Reemplaza lo que ya haya de ese partido.</p><div class="dlgbtns"><button onclick="closeDlg()">Cancelar</button><button class="prim" onclick="window._up(${fx})">Subir</button></div>`);
  }
};
$("#btnClear").onclick=()=>{
  if(!confirm("¿Vaciar el anotador de este equipo? Borra partido, marcador y jugadas."))return;
  ST={partido:"",rivalPts:0,plays:[],down:"",fxManual:null};save();lastPasador=null;draft=null;defDraft={events:[],ev:"flagb",editId:null};
  $("#partido").value="";setSide("off");renderDown();renderList();renderScore();renderSummary();
};
function openDlg(html){$("#dlgBody").innerHTML=html;$("#dlg").showModal();}
window.closeDlg=()=>$("#dlg").close();

/* ---------- inputs base ---------- */
$("#partido").oninput=e=>{ST.partido=e.target.value;save();updatePartidoLabel();};
$("#pickBtn").onclick=openPartidoPicker;
$("#suggestBtn").onclick=()=>{const id=suggestId();ST.partido=id;save();$("#partido").value=id;updatePartidoLabel();};
$("#fxPlus").onclick=()=>{ST.fxManual=fenixScore()+1;save();renderScore();};
$("#fxMinus").onclick=()=>{ST.fxManual=Math.max(0,fenixScore()-1);save();renderScore();};
$("#rvPlus").onclick=()=>{ST.rivalPts++;save();renderScore();};
$("#rvMinus").onclick=()=>{ST.rivalPts=Math.max(0,ST.rivalPts-1);save();renderScore();};
$("#bOff").onclick=()=>setSide("off");
$("#bDef").onclick=()=>setSide("def");

/* ---------- sincronizar planteles ---------- */
function parseCSV(t){const R=[];let r=[],f="",q=false;t=(t||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===","){r.push(f);f="";}else if(c==="\n"){r.push(f);R.push(r);r=[];f="";}else f+=c;}}if(f.length||r.length){r.push(f);R.push(r);}return R.filter(x=>x.some(y=>y.trim()!==""));}
let FIXGAMES=[];
async function fetchTab(sheetId,tab){
  const url=`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
  const txt=await fetch(url).then(r=>r.ok?r.text():""); return parseCSV(txt);
}
let INDEX=null, season="";
function extractSheetId(x){x=(x||"").trim();const m=x.match(/\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:x;}
async function loadIndexAnotador(){
  if(!CONFIG.INDEX_ID){INDEX=null;return;}
  try{const rows=await fetchTab(extractSheetId(CONFIG.INDEX_ID),"Indice");
    if(rows.length<2){INDEX=null;return;}
    const h=rows[0].map(x=>x.trim());const ct=h.indexOf("Temporada"),cg=h.indexOf("Genero"),cp=h.indexOf("Planilla"),ca=h.indexOf("Activa");
    if(ct<0||cp<0){INDEX=null;return;}
    const list=rows.slice(1).map(r=>({temporada:(r[ct]||"").trim(),genero:(cg>=0?(r[cg]||"").trim():""),id:extractSheetId((r[cp]||"").trim()),activa:(ca>=0?(r[ca]||"").trim().toUpperCase():"SI")})).filter(x=>x.temporada&&x.id&&x.activa!=="NO");
    INDEX=list.length?list:null;
  }catch(e){INDEX=null;}
}
function seasonsForGender(){if(!INDEX)return[];const gg=gender==="f"?"femenino":"masculino";return [...new Set(INDEX.filter(r=>r.genero.toLowerCase()===gg).map(r=>r.temporada))].sort().reverse();}
function sheetIdFor(){if(INDEX){const gg=gender==="f"?"femenino":"masculino";const row=INDEX.find(r=>r.temporada===season&&r.genero.toLowerCase()===gg);if(row)return row.id;}return gender==="f"?CONFIG.SHEET_ID_F:CONFIG.SHEET_ID;}
function buildTournamentUI(){
  const sel=$("#tournSel"); if(!sel)return;
  const seasons=seasonsForGender();
  if(!seasons.length){sel.style.display="none";season="";return;}
  let saved=""; try{saved=localStorage.getItem("fenixTourn_"+gender)||"";}catch(e){}
  season=seasons.includes(saved)?saved:(seasons.includes(season)?season:seasons[0]);
  sel.innerHTML=seasons.map(x=>`<option value="${x}" ${x===season?"selected":""}>${x}</option>`).join("");
  sel.style.display="";
  sel.onchange=()=>{season=sel.value;try{localStorage.setItem("fenixTourn_"+gender,season)}catch(e){}FIXGAMES=[];syncRoster();loadFixGames().then(updatePartidoLabel);};
}
async function loadFixGames(){
  const sid=sheetIdFor(); if(!sid){FIXGAMES=[];return;}
  let games=[], done=new Set();
  try{const rows=await fetchTab(sid,"Fixture");
    if(rows.length>1){const h=rows[0].map(x=>x.trim());const ci=h.indexOf("ID"),cf=h.indexOf("Fecha"),cl=h.indexOf("Local"),cv=h.indexOf("Visitante");
      if(cl>=0&&cv>=0)rows.slice(1).forEach(r=>{const lo=(r[cl]||"").trim(),vi=(r[cv]||"").trim();let rival=null;
        if(lo.toLowerCase()==="fenix")rival=vi;else if(vi.toLowerCase()==="fenix")rival=lo;else return;
        const id=ci>=0?(r[ci]||"").trim():"",fe=cf>=0?(r[cf]||"").trim():"";
        games.push({id,label:(fe?fe+" ":"")+"vs "+rival});});}
  }catch(e){}
  try{const rows=await fetchTab(sid,"Off");
    if(rows.length>1){const h=rows[0].map(x=>x.trim());const cp=h.indexOf("Partido");
      if(cp>=0)rows.slice(1).forEach(r=>{const v=(r[cp]||"").trim();if(v)done.add(v);});}
  }catch(e){}
  games.forEach(g=>g.hasData=done.has(g.id));
  FIXGAMES=games;
}
function partidoLabel(id){if(!id)return"";if(!FIXGAMES.length)return"";const g=FIXGAMES.find(x=>x.id.toLowerCase()===id.toLowerCase());return g?g.label:"Nuevo partido";}
function updatePartidoLabel(){const el=$("#partidoLabel");if(!el)return;const lb=partidoLabel(ST.partido);el.textContent=lb;el.style.color=(lb==="Nuevo partido")?"var(--flag)":"var(--turf)";}
function suggestId(){
  const ids=FIXGAMES.map(g=>g.id).filter(Boolean);
  const counts={}; ids.forEach(id=>{const m=/^([a-z]+\d+)-\d+$/i.exec(id);if(m)counts[m[1]]=(counts[m[1]]||0)+1;});
  const pfx=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]||((gender==="f"?"f":"m")+"26");
  let maxn=0; ids.forEach(id=>{const m=new RegExp("^"+pfx+"-(\\d+)$","i").exec(id);if(m)maxn=Math.max(maxn,+m[1]);});
  return pfx+"-"+String(maxn+1).padStart(2,"0");
}
async function openPartidoPicker(){
  openDlg('<h3 style="margin:0 0 8px">Partidos del fixture</h3><p class="hint">Cargando…</p>');
  await loadFixGames();
  if(!FIXGAMES.length){ openDlg('<h3 style="margin:0 0 8px">Partidos del fixture</h3><p class="hint">No pude leer el fixture (¿sin señal, o todavía vacío?). Usá el modo manual: escribí el ID o tocá Sugerir ID.</p><div class="dlgbtns"><button class="prim" onclick="closeDlg()">Ok</button></div>'); return; }
  const items=FIXGAMES.map((g,i)=>`<button onclick="pickPartido(${i})" style="display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;margin-bottom:6px;font-size:14px">${g.label}${g.hasData?' <span style=\'color:var(--turf);font-weight:800;font-size:12px\'>✓ con datos</span>':''}${g.id?` <small style=\'color:var(--muted)\'>${g.id}</small>`:' <small style=\'color:var(--flag)\'>sin ID</small>'}</button>`).join("");
  openDlg('<h3 style="margin:0 0 8px">Elegí el partido</h3><div style="max-height:52vh;overflow:auto">'+items+'</div><div class="dlgbtns"><button onclick="closeDlg()">Cerrar</button></div>');
}
window.pickPartido=(i)=>{const g=FIXGAMES[i];if(!g)return;if(!g.id){alert("Ese partido no tiene ID en el fixture. Ponele un ID en la columna ID del Fixture, o cargalo a mano.");return;}ST.partido=g.id;save();$("#partido").value=g.id;closeDlg();renderAll();updatePartidoLabel();};
async function fetchPlantel(sheetId,tab){
  const url=`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
  const txt=await fetch(url).then(r=>r.ok?r.text():"");
  const rows=parseCSV(txt);if(rows.length<2)return null;
  const head=rows[0].map(h=>h.trim()),ci=head.indexOf("Numero"),cn=head.indexOf("Nombre");
  if(ci<0)return null;
  const list=rows.slice(1).map(r=>({n:parseInt(String(r[ci]).replace('#',''),10),name:(r[cn]||"").trim()})).filter(p=>!isNaN(p.n));
  list.sort((a,b)=>a.n-b.n);return list.length?list:null;
}
async function syncRoster(){
  // cache primero
  try{const c=JSON.parse(localStorage.getItem("fenixRoster_"+gender));if(c&&c.length){ROSTERS[gender]=c;ROSTER=ROSTERS[gender];renderArea();}}catch(e){}
  const sid=sheetIdFor();
  if(!sid)return;
  try{const list=await fetchPlantel(sid,CONFIG.TAB_PLANTEL);
    if(list){ROSTERS[gender]=list;ROSTER=ROSTERS[gender];try{localStorage.setItem("fenixRoster_"+gender,JSON.stringify(list))}catch(e){}renderArea();}}catch(e){}
}

/* ---------- arranque ---------- */
function renderAll(){$("#partido").value=ST.partido||"";renderGender();setSideButtons();renderArea();renderDown();renderList();renderScore();renderSummary();}
renderAll();loadIndexAnotador().then(()=>{buildTournamentUI();syncRoster();loadFixGames().then(updatePartidoLabel);});
</script>
